name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  voxel-core:
    name: voxel-core (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S voxel-core -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Determinism digest
        run: ./build/bench/vxc_bench --radius 16 --digest | tee digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.compiler }}
          path: digest.txt

  voxel-core-msvc:
    name: voxel-core (msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S voxel-core -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Determinism digest
        shell: pwsh
        run: build/bench/Release/vxc_bench.exe --radius 16 --digest | Tee-Object -FilePath digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: digest-msvc
          path: digest.txt

  # Doctrine §2.3 proxy gate: gcc, clang, and msvc builds must derive bit-identical
  # worlds. The real M0 gate (NVIDIA vs AMD GPU) needs self-hosted runners
  # once the GPU port exists.
  determinism-cross-compiler:
    needs: [voxel-core, voxel-core-msvc]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
      - name: Compare digests
        # tr strips the CRLF the Windows job writes; compare bytes after that.
        run: |
          tr -d '\r' < digest-g++/digest.txt > a.txt
          tr -d '\r' < digest-clang++/digest.txt > b.txt
          tr -d '\r' < digest-msvc/digest.txt > c.txt
          cat a.txt b.txt c.txt
          diff a.txt b.txt
          diff b.txt c.txt

  # Doctrine §2.3: no floating point in world-derivation code. Bench/timing
  # and UE-side rendering are outside the boundary.
  float-ban:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Grep for float/double in voxel-core src+include (comments/strings stripped)
        shell: python
        run: |
          import re, sys, pathlib
          # Doctrine bans float/double as TYPES in world-derivation code, not
          # the words "double" / "float" appearing in comments or strings
          # (e.g. "double-visit"). Strip // and /* */ comments and string
          # literals before searching so prose never trips the guard.
          bad = []
          for base in ("voxel-core/include", "voxel-core/src"):
              for f in pathlib.Path(base).rglob("*"):
                  if f.suffix not in (".h", ".hpp", ".cpp", ".cc"):
                      continue
                  src = f.read_text(encoding="utf-8", errors="replace")
                  src = re.sub(r"/\*.*?\*/", " ", src, flags=re.S)   # block comments
                  src = re.sub(r"//[^\n]*", " ", src)                # line comments
                  for i, line in enumerate(src.splitlines(), 1):
                      if re.search(r"\b(float|double)\b", line):
                          bad.append(f"{f}:{i}: {line.strip()}")
          if bad:
              print("float/double type found in voxel-core world-derivation code:")
              print("\n".join(bad))
              sys.exit(1)
          print("float-ban clean")

  # No CI job compiles the Unreal module -- see .github/workflows/ue-build.yml
  # for the measurement that says why (the engine is a 30 GB install; a hosted
  # runner has a 14 GB disk). This job is the engine-free substitute for the
  # one defect class that has actually shipped because of that gap.
  #
  # VoxelSweBreachFixture.cpp and VoxelOceanCaptureFixture.cpp each declared
  # `using FRunRef` for a different type with internal linkage. Separate
  # translation units make that correct C++; UBT concatenates a module's .cpp
  # files into unity blobs, and in one blob the two names are one scope. The
  # default build failed. `-DisableUnity` hid it, which is how it shipped
  # (PR #210). Nothing in review, in a `-DisableUnity` build, or in any other
  # CI job here can see that class.
  #
  # The lint models the scope rules rather than banning anonymous namespaces
  # (~30 files use them correctly): a name is a hazard when it is reachable by
  # UNQUALIFIED lookup at file scope, which includes anonymous-namespace
  # members, file-scope statics, and -- the mechanism that actually fired --
  # a named namespace hoisted by a file-scope `using namespace`. Aliases and
  # variables collide when they DIFFER, functions when their signatures MATCH,
  # types always. Findings are silenced one at a time by an annotation that
  # must carry a reason; unused annotations are failures, as in shader-ub-lint.
  #
  # Runs on ubuntu because it needs nothing but Python and the source tree.
  unity-collision-lint:
    name: Unity internal-linkage collision lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint ue-project modules for unity name collisions
        run: python tools/lint-unity-collisions.py

  # The front end (main menu + loading screen) is suppressed on any run that
  # drives itself, so that the ~190 -Voxel* verification switches keep behaving
  # exactly as they did before it existed. That classification is a naming
  # convention rather than a list, and the failure when the convention does not
  # reach a new switch is silent: the capture stops at a menu nobody is there
  # to click and hangs until the watchdog kills it minutes later. This job
  # makes that failure loud at review time instead.
  #
  # Same shape and same justification as the unity lint above -- a defect class
  # no CI job here can compile its way to, caught with nothing but Python and
  # the source tree.
  frontend-switch-coverage:
    name: Front-end switch classification lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every -Voxel* switch is classified against the front-end policy
        run: python tools/lint-frontend-switch-coverage.py

  # ADR-0001 determinism surface: the M0 gate passed on AMD and failed on
  # NVIDIA running the IDENTICAL committed SPIR-V, because worldgen.ush's
  # floorDiv derived its flooring correction from `a % b` and HLSL leaves `%`
  # undefined unless both operands share a sign (commit 6ab4b2a). This job
  # makes that whole class mechanical: it fails on signed `/`/`%` that is not
  # routed through the approved floorDiv/truncDiv helpers, on non-constant or
  # over-wide shifts, on unsigned subtraction that can underflow into an
  # index, on unclamped buffer writes, and on wave/subgroup-width assumptions
  # (AMD wave64 vs NVIDIA warp32). Like float-ban, it blanks comments and
  # string literals before matching so prose can never trip it. Safe
  # constructs are silenced one at a time by an inline annotation that must
  # carry a written reason; unused annotations are themselves failures.
  #
  # --spv-dir additionally scans the COMMITTED bytecode for the OpSDiv/
  # OpSRem/OpSMod opcodes. The HLSL rules are heuristic; the opcode scan is
  # exact, and it is what catches the shipped bug directly no matter how the
  # source is written.
  shader-ub-lint:
    name: Shader vendor-divergence lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint HLSL kernels + audit committed SPIR-V
        run: >
          python tools/lint-shader-ub.py voxel-core/shaders
          --spv-dir voxel-core/shaders/prebuilt

  terrain-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install -r terrain-service/requirements.txt
      - name: Test (incl. golden tiles)
        run: cd terrain-service && python -m pytest -q

  # asset-forge had no CI job of any kind until this one, while its README named
  # `python -m forge.cli selftest` as one of the two things to run before calling
  # a change done. Nothing enforced it, and the generator's own measurements were
  # the same story one level down: `pipeline.build` has been writing
  # `airborne_kept` and `orphans_removed` into every asset's stats and no code
  # anywhere read either key. Every floating-rock defect in that library was
  # found by a person looking at a render.
  #
  # Two steps, because they answer different questions and one is much cheaper
  # than the other. `selftest` is determinism, the .vox/.vxa round trips and
  # whether forge/palette.py is still what the engine header says (that is the
  # asset-forge half of the palette-drift guard; the UE .ush half is checked by
  # tools/compile-shaders.ps1 in the Shader compilation job below, and there is
  # deliberately no third copy). `buildcheck` builds every spec in specs/ and
  # fails on a spec-validation warning, on a health problem, and on any build
  # that comes out as more than ONE connected piece.
  #
  # No path filter on purpose. A rock defect here is usually caused by a change
  # to forge/rock.py, but the specs are data and the last two defects were spec
  # tuning, so scoping this job to a subtree would have missed them.
  #
  # WHAT THIS JOB DOES NOT COVER, and why. Four specs dominate the wall clock
  # and one of them cannot run here at all: `hero-arch-colossal` is 26M voxels
  # at its authored 5 cm, needs a 23.6 GB working set, takes 27 minutes on a
  # dev box and raises MemoryError on some seeds. So the library is built in
  # two passes -- 63 specs at their authored size, then the four heavy ones at
  # 20 cm. The coarse pass is a WEAKER check (pieces touching at a single voxel
  # can merge on a coarser lattice, and a thin neck can part), and it is run
  # rather than skipped because a hero that comes apart into six pieces still
  # comes apart at 20 cm -- that is how large the defects being caught here are.
  # A hero regression that only shows at 5 cm is caught by a person running
  # `python tools/buildcheck.py --only-heavy` locally, not by this job.
  #
  # Seed 1 only. Three seeds is the local sign-off command (`--seeds 1 2 3`),
  # not the per-PR gate.
  asset-forge:
    name: asset-forge (selftest + every spec)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # asset-forge has no requirements file: its dependencies are declared in
      # prose in asset-forge/README.md ("Needs numpy, scipy, pillow"). This list
      # was verified against the imports rather than copied from that line --
      # numpy and Pillow throughout, scipy for ndimage (the connectivity and
      # support passes) and spatial.cKDTree (clump separation). The app adds
      # nothing: it is stdlib http.server and a hand-written page.
      - name: Install deps
        run: python -m pip install numpy scipy pillow
      # --quick skips selftest's own whole-library one-piece pass, and says so
      # in its output. Nothing is lost: the next step runs that same rule over
      # every spec and adds the health and spec-warning checks on top. Without
      # it this job would build the entire library twice for one verdict.
      - name: Selftest
        run: cd asset-forge && python -m forge.cli selftest --quick
      # Measured on a dev box at seed 1: 7 minutes for the 63, 3 minutes for the
      # heavy four at 20 cm. 10 cm was tried for the coarse pass and abandoned
      # -- hero-arch-colossal alone runs over 20 minutes there, against 110 s at
      # 20 cm, because the size fit re-searches on a grid 8x larger.
      - name: Build every spec (one asset per generation, no warnings)
        run: cd asset-forge && python tools/buildcheck.py --skip-heavy
      - name: The four heavy heroes, on a coarse lattice
        run: cd asset-forge && python tools/buildcheck.py --only-heavy --res 20

  # THE COLOUR SYSTEM'S GUARD, and it runs HERE rather than in the shader job
  # below because the shader job is windows-latest and needs DXC. That made the
  # palette drift check unrunnable for anyone working on Linux -- including this
  # repo's own voxel-core work, which is where the palette lives.
  #
  # Three questions, none of which needs a GPU or an editor:
  #
  #   1. Have the generated copies drifted from vxc::kMaterialPalette? Three of
  #      them: VoxelMaterialPalette.ush, terrain_palette.py, and asset-forge's
  #      forge/palette.py.
  #   2. Do the three EVALUATIONS still agree with vxc::voxelTint? The shipped
  #      shader text is compiled AS C++ (tools/hlsl_cpp_shim.h) and run against
  #      it; so is asset-forge's numpy mirror. This is the half that matters:
  #      the table went single in ADR-0008 and three consumers then grew three
  #      different evaluations of it, one of which silently dropped the whole
  #      far-field term on 85% of the world's placements.
  #   3. Does the terrain material graph still BUILD? It is a commandlet nobody
  #      can run without the editor, so it is executed against a recording stub
  #      instead. That says the code runs, not that the material is correct --
  #      the script says so in its own output, and a capture is still the real
  #      check.
  #
  # numpy is installed for the asset-forge arm. Without it that arm reports
  # SKIPPED and names what went unchecked rather than passing quietly.
  palette-parity:
    name: Voxel colour parity (table + evaluation + graph)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install numpy pillow
      - name: Generated palettes match the engine header
        run: python ue-project/Tools/gen_material_palette_ush.py --check
      - name: Every evaluation agrees with vxc::voxelTint
        run: python tools/check-palette-parity.py --samples 2000
      - name: The terrain material graph builds
        run: python tools/check-terrain-graph.py
      # Not a check -- an artifact. The palette is 47 rows of five numbers and
      # the question anyone has about it is what it LOOKS like; this is how that
      # gets reviewed on a pull request without the editor.
      - name: Render the palette contact sheet
        run: python tools/palette-sheet.py -o palette-sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: palette-sheet
          path: palette-sheet.png

  shader-compile:
    name: Shader compilation (DXIL + SPIR-V)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch DXC
        shell: pwsh
        run: pwsh tools/fetch-dxc.ps1
      - name: Compile shaders
        shell: pwsh
        run: pwsh tools/compile-shaders.ps1
      - name: List produced artifacts
        shell: pwsh
        run: Get-ChildItem build/shaders

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build terrain-service Docker image
        run: docker build terrain-service
