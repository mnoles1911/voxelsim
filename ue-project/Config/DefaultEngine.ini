; --- SM6 for the voxel GPU kernels (ADR-0006, G2a) --------------------------
; Unreal 5.8 targets PCD3D_SM5 only by default (BaseEngine.ini). The voxel
; worldgen/mesher kernels in voxel-core/shaders/worldgen.ush are 64-bit integer
; throughout -- world coordinates and the SplitMix64 hash -- and 64-bit integer
; shader ops only exist on the DXC/SM6 path. Under SM5 the kernels do not
; compile at all, so SM6 is a hard requirement, not a quality setting.
;
; This does not remove SM5; it adds SM6 alongside it.
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
+D3D12TargetedShaderFormats=PCD3D_SM6


; --- NEAR-FIELD TEMPORAL STABILITY (TSR vs the 10 cm voxel step lattice) -----
;
; THE SYMPTOM. Standing perfectly still, the near field shimmers -- worst on
; water, visible on terraced ground. Measured 2026-08-11 with the burst harness
; (tools/voxel-capture.ps1 -BurstCount, N frames from one settled pose, camera
; pinned and sun frozen) at the lake shore -65102,-51084 +9 m, pitch -5, yaw
; 200, noon, 2560x1440. Metric: percent of pixels whose consecutive-frame delta
; exceeds 4/255.
;
; WHAT IT IS, established by elimination rather than by guessing. With the water
; material's ripple Time frozen to a constant AND anti-aliasing off, the
; renderer is bit-stable: 0.00% on terrain, 0.23% on water. Nothing in the
; scene moves. That single arm kills, together, every "something is updating"
; explanation -- re-meshing, LOD flapping, Lumen, VSM shadows, SSAO, the GI
; volumes -- and it was independently confirmed for geometry from the perf
; counters at the shutter (componentsApplied=0, editRemeshes=0, dispatched=0,
; the water pool byte-identical frame to frame).
;
; What remains is TSR's own sub-pixel jitter meeting the voxel step lattice.
; The 10 cm steps are viewed at a grazing angle, so each step RISER is a one-
; to-three-pixel high-contrast line; TSR moves the sample grid every frame,
; those lines land differently every frame, and the history rejection never
; settles. It is not specular: disabling specular entirely (showflag.specular
; 0) left the number unchanged on water and only slightly lower on terrain. It
; is not minification aliasing either -- the FAR field is 10x quieter than the
; near, because the LOD rings make distant geometry coarser in screen space
; than the near 10 cm steps.
;
; TWO THINGS THAT LOOK LIKE FIXES AND ARE NOT, both measured here so nobody
; spends the run again:
;   * r.ScreenPercentage 100 makes it WORSE (water 5.66% -> 8.16%). This project
;     renders at ~61% by UE's automatic display-resolution default and TSR
;     upsamples; the softer input is MORE stable, not less. Rendering sharper
;     hands TSR more of exactly the content it cannot resolve.
;   * Turning anti-aliasing off makes it worse too (near half 37% -> 49%). TSR
;     is suppressing this artefact, not causing it.
;
; WHAT THESE FOUR LINES DO. Measured with ripple animation frozen, so these are
; instability numbers and not animation:
;   near terrain  3.28% -> 0.92%   (-72%)
;   far field     1.06% -> 0.43%   (-59%)
;   water         5.66% -> 4.88%   (-14%)
; GPU cost at the same pose, from a deferred ProfileGPU frame: 12.10 ms before,
; 12.04 ms after -- the two new TSR passes (DetectThinGeometry 0.064 ms,
; MeasureThinGeometryCoverage 0.008 ms) are inside run-to-run variance.
[SystemSettings]
; ---- SHIPPED 50% INTERNAL RESOLUTION, 2026-08-29. OWNER DECISION. ----------
; The >100 fps goal's GPU half, bought with the one lever the marcher's cost
; law allows: ray count. Before this line the project rendered at ~61% by UE's
; automatic display-resolution default (1552x873 for a 2560x1440 display) and
; TSR upscaled. Swept 60.6/55/50 on matched line-flight legs, engagement read
; off the marcher's own view= line (the SECOND print -- the first is the
; pre-cvar startup value, a trap that has already eaten one reading):
;
;     60.6%  1552x873  p50 120.5  p95  88.9  p99 77.9 fps   stutters 0.51%
;     55%    1408x792  p50 133.1  p95  96.8  p99 84.0       0.40%
;     50%    1280x720  p50 145.0  p95 103.6  p99 88.2       0.35%
;
; 50% crosses the 100 fps p95 goal. The owner judged the three pinned stills
; side by side: "All 3 of those screen captures look the same." Stills cannot
; show shimmer in motion (a different mechanism from the rejected half-res --
; uniform TSR input scaling, not sparse rays -- but the same judgement
; applies): the standing check is one ordinary flight, and if moving shimmer
; is ever reported, this is the first line to suspect, alongside the
; SampleCount note above.
; Delete this line to restore the automatic ~61%.
r.ScreenPercentage=50
; Epic ships this OFF unless Nanite Foliage is enabled, and its own description
; is this project's exact case: "detect thin geometries (sub-pixel in frame
; buffer) ... Edge line: single pixel line over non foliage". It relaxes history
; rejection on those pixels. This is the line that fixes the terrain half.
r.TSR.ThinGeometryDetection=1
; Default 16, engine maximum 32: "Higher values means more stability on
; highlights on static images". Costs nothing -- it is a clamp constant in the
; history update, not extra work. THE ONE UNMEASURED COST: the same doc warns of
; "additional ghosting on fireflies style of VFX", which only shows with the
; camera MOVING, and every arm behind these numbers was taken standing still.
; If moving-camera ghosting ever gets reported, this is the first line to try.
r.TSR.History.SampleCount=32
; THE WATER HALF, AND THE ONE LINE HERE WITH A REAL TRADE.
;
; With TSR enabled the engine FORCES separate translucency on
; (r.TSR.ForceSeparateTranslucency defaults to 1), which composites translucency
; after the temporal resolve. TSR's whole anti-flicker machinery reads the scene
; as it was BEFORE any translucency was drawn -- the flickering heuristic says so
; in its own help text, and thin-geometry detection has an explicit translucency
; opt-out -- so the water surface sits outside all of it. That is why the water
; half barely responds to the two lines above and why it is the stubborn half.
;
; These two put translucency back inside the temporal resolve. It is worth 14%
; on water and about 0.1 ms in the Translucency pass. The trade: translucency is
; now affected by depth of field (that is the documented meaning of 0), and
; because water is now temporally accumulated it could ghost while moving --
; NOT MEASURED, for the same standing-still reason as above. Delete these two
; lines to revert; the two above are independent of them.
r.TSR.ForceSeparateTranslucency=0
r.SeparateTranslucency=0

; SINGLE LAYER WATER REFLECTION MODE (2026-08-11, with the M_WaterVoxel port).
;
; 2 = reflection captures + skylight only. THIS IS A FIRST-CLASS ENGINE MODE AND
; NOT A DEGRADED FALLBACK, which is worth stating because the number looks like
; a quality level and is not one. SingleLayerWaterRendering.cpp offers
; 0 = none, 1 = SSR, 2 = reflection captures/skylight, 3 = Lumen; single layer
; water has never used planar reflections, so choosing 2 gives up nothing this
; project's water ever had.
;
; WHY NOT 1 (SSR). A screen-space reflection is a scene-colour read by another
; name, and it is the one thing water in this project has consistently been kept
; away from -- see the ban recorded at the top of
; Tools/create_water_voxel_material.py. The SLW port dissolves that ban for the
; volume term (the engine reads a copy of scene colour taken BEFORE any water
; drew, so it is order-independent), but SSR is a different animal: it is
; noisy, it needs its own denoiser and TAA path
; (r.Water.SingleLayer.Reflection.Denoising / .SSRTAA), and this frame is
; already render-thread bound. Not now, and not without a measurement.
;
; WHY NOT 3 (LUMEN), AND THIS IS THE TRAP WORTH RECORDING. Mode 2 also disables
; Lumen reflections on water, which sounds like a real loss and is not one here:
; Lumen traces against mesh distance fields, and voxel terrain in this project
; has NO mesh distance fields at all (verified -- it is why
; DistanceToNearestSurface and Lumen SDF tracing are dead ends for every plan
; that has proposed them). Lumen has no geometry to trace, so it was never
; available on this water and mode 2 costs nothing. On a project WITH distance
; fields this line would be a genuine trade.
r.Water.SingleLayer.Reflection=2


; ============================================================================
; SHADOWS: UNDO A SAVED LOW-QUALITY SCALABILITY PRESET (2026-08-19)
;
; THE BUG THIS FIXES. The terrain cast no dynamic shadows and NO SHADOW PASS
; EXISTED AT ALL -- a GPU capture showed only VolumeCascade and
; ClearDepthStencil, and the pool's own census read shadowGather=0 on every
; frame of every leg. Every per-light and per-primitive knob read correct:
; the sun is Movable, CastShadows=1, DynamicShadowCascades=4,
; DynamicShadowDistanceMovableLight=40000 UU, and the pool proxy sets
; bShadowRelevance. All of that was irrelevant, because the gate that failed
; is upstream of all of it:
;
;   ShadowSetup.cpp:6365   if (GetShadowQuality() > 0)
;
; GetShadowQuality() (ShadowRendering.cpp:258) is just r.ShadowQuality. When
; it is 0, FSceneRenderer::CreateDynamicShadows skips its ENTIRE per-light
; loop -- no light is examined, no whole-scene shadow is created, nothing
; lands in SortedShadowsForShadowDepthPass, and so no ShadowDepths pass is
; ever added to the graph. That is exactly the observed shape: every setting
; correct, no pass at all.
;
; WHERE THE 0 CAME FROM, AND WHY IT LOOKED RULED OUT. Boot applies scalability
; TWICE. The first pass is the default level 3 and sets r.ShadowQuality=5.
; Then Saved/Config/WindowsEditor/GameUserSettings.ini is read, and it holds
; sg.ShadowQuality=0 (alongside ViewDistance/PostProcess/Effects/Resolution
; at 0 -- someone saved a low preset once and Saved/ is not in git). That
; second pass re-applies only the groups that differ from 3, and it sets
; r.ShadowQuality=0. In any of our logs both passes are present and the
; SECOND one wins:
;
;   [ShadowQuality@3] ... Set CVar [[r.ShadowQuality:5]]     <- line 673
;   [ShadowQuality@0] ... Set CVar [[r.ShadowQuality:0]]     <- line 864
;
; Grepping for ShadowQuality@3 and stopping there is how this got recorded as
; "scalability ruled out". No leg in Saved/ has ever set r.ShadowQuality or
; sg.ShadowQuality at runtime -- it was never actually forced.
;
; WHY THIS SECTION AND NOT GameUserSettings.ini. [ConsoleVariables] in
; DefaultEngine.ini is applied AFTER the scalability passes (log line 938 vs
; 862) and at ECVF_SetByConsoleVariablesIni (0x0A), which outranks
; ECVF_SetByScalability (0x02). FConsoleVariableBase::CanChange
; (ConsoleManager.cpp:275) then silently refuses any later scalability write,
; boot-time or runtime, and calls it "a deliberate fail". So this survives a
; stale Saved/, a GameUserSettings rewrite, and a different machine. Editing
; GameUserSettings.ini instead would fix this box only, until something calls
; UGameUserSettings::SaveSettings.
;
; THE PRICE: sg.ShadowQuality can no longer turn these four down. That is the
; intent -- shadows silently vanishing is the failure we are buying out of.
; Delete this block to revert.
;
; THE OTHER THREE knobs the @0 pass set are restored because each one, on its
; own, would leave shadows technically present and visibly wrong:
;   MaxCascades 1     caps FViewInfo::MaxShadowCascades, so the sun's four
;                     cascades collapse to one no matter what the light asks.
;   MaxCSMResolution  512 over 400 m is ~1.3 m per texel -- blobs, not shadows.
;   DistanceScale 0.6 quietly turns the 400 m shadow distance into 240 m.
; RadiusThreshold 0.06 culls small casters by screen radius; the terrain pool's
; bounds clear it either way, but foliage would not.
;
; Deliberately NOT restored: r.DistanceFieldShadowing and r.CapsuleShadows stay
; at the @0 value 0. Voxel terrain in this project has no mesh distance fields
; at all (see the SingleLayerWater note above), so both are dead weight here.
; ============================================================================
[ConsoleVariables]
r.ShadowQuality=5
r.Shadow.CSM.MaxCascades=10
r.Shadow.MaxCSMResolution=2048
r.Shadow.DistanceScale=1.0
r.Shadow.RadiusThreshold=0.01

; --- AMENDMENT 2026-08-24: FOUR MORE KNOBS FROM THE SAME @0 PASS ------------
; The block above accounted for five knobs of [ShadowQuality@0] and explicitly
; wrote off two more (DistanceFieldShadowing, CapsuleShadows). It did not
; account for the REST of that section, and four knobs were left sitting at the
; lowest preset. Re-read UE_5.8/Engine/Config/BaseScalability.ini on 2026-08-24
; and diffed [ShadowQuality@0] (line 132) against [ShadowQuality@3] (line 240)
; knob by knob rather than trusting the earlier inventory. The values below are
; Epic's own @3 values copied VERBATIM, the same way the SkyAtmosphere block
; further down was built.
;
; THIS IS A QUALITY RESTORATION, NOT A PERF CHANGE, and the direction is worth
; being blunt about because the surrounding file is mostly perf work: these
; knobs were making the picture WORSE for a saving nobody asked for and nobody
; measured. No one chose them; a stale Saved/Config preset did.
;
;   r.Shadow.MaxResolution              512 -> 2048  (@3; also the C++ default)
;   r.Shadow.CSM.TransitionScale        0   -> 1.0   (@3; also the C++ default)
;   r.Shadow.PreShadowResolutionFactor  0.5 -> 1.0   (@3; C++ default is 0.5)
;   r.LightMaxDrawDistanceScale         0.5 -> 1     (@3; also the C++ default)
;
; WHAT EACH ONE ACTUALLY FEEDS, traced through UE 5.8 source so the next reader
; does not have to guess which of these are even live in THIS project:
;
;  * r.Shadow.MaxResolution sizes the shadow depth TEXTURE, via
;    GetShadowDepthTextureResolution (ShadowSetup.cpp:727) -- per-object, inset
;    and preshadow depths, read again at ShadowSetup.cpp:5981. IT DOES NOT CAP
;    CSM. That was checked explicitly rather than assumed, because a 512 sitting
;    underneath a pinned MaxCSMResolution=2048 looks exactly like a silent
;    clamp that would have made the line four above a no-op. It is not one: the
;    CSM path at ShadowSetup.cpp:5735-5738 clamps MaxCSMResolution against
;    GMaxShadowDepthBufferSize only, never against this cvar. So the sun's
;    cascades were already 2048; this line is about everything else.
;
;  * r.Shadow.CSM.TransitionScale IS live on the sun and is the one here with a
;    directly visible effect. 0 means "no transition (fastest)" in the engine's
;    own help text (ConsoleManager.cpp:4378-4385): the fade band between
;    cascades collapses to zero width, so cascade boundaries read as a hard
;    seam sweeping across the ground as the camera moves, rather than a blend.
;    1.0 means "as specified in the light settings", i.e. the sun's own
;    CascadeTransitionFraction is honoured instead of being overridden to none.
;
;  * r.Shadow.PreShadowResolutionFactor scales PRESHADOW resolution only
;    (static world casting onto characters -- r.Shadow.Preshadows,
;    ShadowSetup.cpp:187). NOTE THE ODD ONE OUT: 0.5 is not just the @0 value,
;    it is ALSO the engine's own C++ default (ShadowSetup.cpp:271), so setting
;    1.0 takes this project ABOVE stock rather than back to it. It is set to
;    Epic's @3 value for consistency with the other three and because a half-
;    resolution preshadow was not a choice either -- but if preshadows ever
;    show up as a cost, this is the cheapest line in this block to drop, and
;    dropping it returns to stock rather than to the low preset.
;
;  * r.LightMaxDrawDistanceScale IS INERT IN THIS PROJECT TODAY and is pinned
;    only so it cannot become a surprise later. It scales a local light's
;    MaxDrawDistance, and the visibility test at SceneVisibility.cpp:5714-5716
;    short-circuits on `ProxyMaxDistance <= 0.0`. Nothing in
;    Source/VoxelEarth sets MaxDrawDistance on any light (grepped 2026-08-24:
;    zero hits), so the scale currently multiplies nothing. WHAT WOULD FALSIFY
;    "inert": the first point or spot light that gets a draw distance. On that
;    day a stale preset would silently halve it, which is precisely the class
;    of failure this whole section exists to stop.
;
; WHY PINNED HERE AND NOT FIXED AS sg.ShadowQuality=3 IN GameUserSettings.ini.
; Three reasons; the first two are the ones the block above already records,
; the third is new and is the one that makes raising the group actually WRONG:
;   1. Saved/Config is not in git and is rewritten wholesale by any call to
;      UGameUserSettings::SaveSettings, so editing it fixes one box until
;      something saves settings, and fixes no other machine ever.
;   2. [ConsoleVariables] is applied AFTER the scalability passes and at
;      SetByConsoleVariablesIni (0x0A), which outranks SetByScalability (0x02),
;      so scalability cannot overwrite it boot-time or at runtime.
;   3. [ShadowQuality@3] ALSO sets r.DistanceFieldShadowing=1 and
;      r.CapsuleShadows=1. This project deliberately keeps both at 0 -- see the
;      "Deliberately NOT restored" note above; there are no mesh distance
;      fields in this world for either to use. Raising the group would quietly
;      undo a decision that was made on purpose, in the name of fixing one that
;      was never made at all. Pinning the individual knobs restores exactly
;      what was lost and nothing else.
; sg.ShadowQuality=0 is therefore LEFT ALONE in Saved/Config on purpose. After
; this block it is a value with no effect on shadows, rather than a value
; nobody noticed.
;
; PERF: NOT MEASURED, and no claim is made here. The one adjacent number that
; exists is from the 2026-08-24 render-frame split legs and it is about
; DIFFERENT settings: an arm with r.Shadow.UseOctreeForCulling=1,
; r.Shadow.CSM.MaxCascades=4, voxel.Sky.VolumetricFog=0 and r.ReflectionMethod=0
; applied TOGETHER moved the parked render floor 8.74 -> 8.52 ms (setupOther
; 7.53 -> 7.35 ms) and the moving frame 20.67 -> 19.34 ms. Individual
; contributions were never separated. Those are not these four lines, and
; nothing in that pair says what shadow RESOLUTION costs. If these ever need a
; verdict, measure them directly: all four are ECVF_Scalability |
; ECVF_RenderThreadSafe, so -ExecCmds sets them at SetByCommandline (0x0D),
; which outranks this block and gives both arms from one binary.
r.Shadow.MaxResolution=2048
r.Shadow.CSM.TransitionScale=1.0
r.Shadow.PreShadowResolutionFactor=1.0
r.LightMaxDrawDistanceScale=1

; AND THE SECOND CAUSE, WHICH ONLY BECAME VISIBLE ONCE THE FIRST WAS FIXED.
; With r.ShadowQuality restored a ShadowDepths pass finally existed -- and drew
; ZERO primitives. GatherShadowPrimitives tests the caster frustum against
; OCTREE NODE bounds (ShadowSetup.cpp:5433-5443) and only nodes that pass are
; ever handed to FilterPrimitiveForShadows. The voxel terrain pool is ONE
; primitive with kilometre-scale bounds, so it sits very high in the octree and
; was lost during descent -- at which point NO per-primitive gate is consulted
; at all. That is why every eligibility flag (castsDynamicShadow, isShadowCast,
; opaque, insetShadow, lightingChannels) read correct while nothing cast.
;
; 0 replaces the descent with a flat walk over Scene->Primitives. Cheap HERE
; because this scene has very few primitives; revisit if that stops being true.
; MEASURED: shadowGathers 0 -> 240 over 60 camera gathers (4.00 per camera
; gather), matching the July record of ~4/frame from when this last worked.
r.Shadow.UseOctreeForCulling=0

; AND THE SAME TRAP, PRE-EMPTED THIS TIME RATHER THAN DEBUGGED.
; r.LightFunctionQuality is set to 0 by the SAME [ShadowQuality@0] scalability
; block that zeroed r.ShadowQuality and cost seven false root-cause
; eliminations. The marched-shadow design injects terrain visibility into the
; sun through a LIGHT FUNCTION MATERIAL -- RenderLightFunction multiplies into
; the sun's ScreenShadowMaskTexture (LightRendering.cpp:2379) -- so at quality 0
; that channel silently does nothing and every receiver reads as unshadowed.
; The failure would look exactly like "the shadow march produces no output",
; which is the hardest possible thing to attribute.
;
; Pinned here for the same reason as the block above: [ConsoleVariables] is
; applied AFTER scalability and at a priority scalability cannot overwrite.
r.LightFunctionQuality=1

; ============================================================================
; FOG (2026-08-20, docs/... fog plan). Four groups, one story: the stale
; Saved/Config scalability preset (sg.*=0, see final-comparison-method.md
; :150-155) has been degrading or disabling all of this on EVERY run this
; project has ever taken -- r.VolumetricFog forced 0 by ShadowQuality@0,
; r.ViewDistanceScale forced 0.4 by ViewDistanceQuality@0, and the SkyAtmosphere
; LUTs at their low tier by EffectsQuality@0. Same mechanism as the shadow
; block above: SetByConsoleVariablesIni (0x0A) outranks SetByScalability (0x02),
; so these lines win over the preset. THE PRICE, same as above: sg.* can no
; longer turn these down; delete a line to hand it back to scalability.
;
; EVERY PERF NUMBER PREDATES THESE LINES. A new baseline leg is mandatory
; before any fog on/off comparison is read (the fog plan's verification
; section); comparing against a pre-fog leg compares two different configs.
;
; --- VOLUMETRIC FOG HAS ONE AUTHORITY, AND IT IS NOT THIS FILE -------------
; (Statement rewritten 2026-08-24 at owner request: volumetric fog "should not
; be pinned on in two places". THE VALUE BELOW IS UNCHANGED AND FOG STAYS ON.
; What changes is that this line stops presenting itself as a second on/off
; switch, because two things that both read like "fog = on" is how a reader
; ends up flipping the wrong one and drawing a conclusion from it.)
;
; THE FEATURE SWITCH IS voxel.Sky.VolumetricFog, declared in
; Source/VoxelEarth/VoxelSkySubsystem.cpp (default 1). It is a TIER, not a
; bool: 0 = off (analytic height fog only), 1 = conservative froxels
; (GridPixelSize 16 / GridSizeZ 64, ~1/4 the froxels of stock), 2 = engine
; default (8/128). It drives the height fog component's bEnableVolumetricFog
; and the r.VolumetricFog.* grid cvars. Change fog THERE. That file decides
; what the game does; this file only stops something else from deciding.
;
; THE LINE BELOW IS A SCALABILITY VETO GUARD. r.VolumetricFog is ECVF_Scalability
; (VolumetricFog.cpp:96) and [ShadowQuality@0] in
; UE_5.8/Engine/Config/BaseScalability.ini:143 sets it to 0. The stale
; sg.ShadowQuality=0 preset in Saved/Config would therefore switch the feature
; off underneath the tier cvar with no error anywhere: tier >= 1, component
; checkbox on, and nothing volumetric on screen. That is the same shape of
; failure the shadow block above cost this project days to find. This line's
; only job is to stop it. Its value equals the engine's own C++ default
; (GVolumetricFog = 1, VolumetricFog.cpp:94) and Epic's [ShadowQuality@3]
; value, so it is not expressing a preference -- it is refusing to let a stale
; preset express one.
;
; SO WHICH ONE WINS? Neither, and that is the point: BOTH gates must pass, and
; they are not interchangeable.
;   * this line at 0 -> no froxel passes at all, whatever the tier says.
;     SpawnRig in VoxelSkySubsystem.cpp logs a warning for exactly that state.
;   * tier 0 -> the component never requests volumetric fog, so the passes do
;     not run either.
; WHAT MAKES THE TIER THE AUTHORITY, rather than this being a coin flip: the
; tier is a CHOICE ABOUT THE GAME; this line is a REPAIR OF A SAVED PRESET. If
; Saved/Config ever stops carrying sg.ShadowQuality=0, this line can be deleted
; with zero change to how the game looks. Deleting the tier changes the game.
; That asymmetry is the whole reason only one of them counts as a switch.
;
; TO A/B FOG, USE THE TIER: -ExecCmds="voxel.Sky.VolumetricFog 0" (or the sky
; ladder's own alt-cvar harness, -VoxelSkyLadderAltCvar). Do not A/B by editing
; this line -- an arm taken that way also removes the guard, so a difference
; could come from either half and you cannot tell which. Note that the pin does
; NOT block experimentation in any case: commandline sets at SetByCommandline
; (0x0D), which outranks this block's SetByConsoleVariablesIni (0x0A). It
; blocks scalability (0x02) and nothing else.
;
; OWNER DECISION 2026-08-24: FOG STAYS ON. He reviewed the 2026-08-24
; render-frame split legs, where an arm with voxel.Sky.VolumetricFog=0,
; r.Shadow.UseOctreeForCulling=1, r.Shadow.CSM.MaxCascades=4 and
; r.ReflectionMethod=0 applied TOGETHER moved the parked render floor
; 8.74 -> 8.52 ms and the moving frame 20.67 -> 19.34 ms, and judged that cheap
; enough to keep. THE FOUR WERE NEVER SEPARATED, so no per-feature fog cost
; exists and nobody should quote one from that pair.
r.VolumetricFog=1
r.ViewDistanceScale=1.0

; SkyAtmosphere LUT quality: Epic's own [EffectsQuality@3] values from
; BaseScalability.ini, copied VERBATIM (not invented) on 2026-08-20 against
; UE 5.8. The preset has been running the vista's aerial perspective -- the
; layer that sells a 92.7 km horizon -- at SampleCountMax 16 and a small-format
; transmittance LUT.
r.SkyAtmosphere.AerialPerspectiveLUT.FastApplyOnOpaque=1
r.SkyAtmosphere.AerialPerspectiveLUT.SampleCountMaxPerSlice=4
r.SkyAtmosphere.AerialPerspectiveLUT.DepthResolution=16.0
r.SkyAtmosphere.FastSkyLUT=1
r.SkyAtmosphere.FastSkyLUT.SampleCountMin=4.0
r.SkyAtmosphere.FastSkyLUT.SampleCountMax=128.0
r.SkyAtmosphere.SampleCountMin=4.0
r.SkyAtmosphere.SampleCountMax=128.0
r.SkyAtmosphere.TransmittanceLUT.UseSmallFormat=0
r.SkyAtmosphere.TransmittanceLUT.SampleCount=10.0
r.SkyAtmosphere.MultiScatteringLUT.SampleCount=15.0

; PROJECT SETTING, not a scalability cvar: couples ExponentialHeightFog to the
; SkyAtmosphere so fog takes its colour FROM the atmosphere instead of carrying
; a second, disagreeing colour table (the exact failure that got the old
; underwater height fog deleted -- VoxelOceanActor.cpp:133-164). The fog
; component ships FogInscatteringLuminance = BLACK and this setting supplies
; the colour. Engine spelling is "Affects", not "Affecting"
; (RendererSettings.h:1036). CHANGING THIS RECOMPILES SHADERS on next launch --
; expect one slow boot.
[/Script/Engine.RendererSettings]
r.SupportSkyAtmosphereAffectsHeightFog=True

; --- REFLECTION METHOD: STATED, NOT INHERITED (2026-08-24) -----------------
; 2 = SSR (EReflectionMethod::ScreenSpace; the enum is required to match the
; cvar, EngineTypes.h:470). NOTHING ABOUT THE RENDERED IMAGE CHANGES WHEN THIS
; LINE IS ADDED. 2 is exactly what this project has always run. It is written
; down because until now it was INHERITED SILENTLY from the engine's C++
; default (CVarReflectionMethod, IndirectLightRendering.cpp:104, default 2)
; while this section set nothing at all. Screen-space reflections on opaque
; terrain were never a decision anybody made -- they are what you get by not
; deciding, and an unstated default is indistinguishable from a choice until
; someone goes and reads the engine source, which is what happened here.
;
; Water is the one surface that DID opt out, and it opted out explicitly:
; r.Water.SingleLayer.Reflection=2 above (captures + skylight, not SSR) with
; its own reasoning recorded. Opaque terrain never had that conversation.
;
; WHY THIS SECTION AND NOT [ConsoleVariables]. This is the project-settings
; home for the cvar -- URendererSettings::Reflections, RendererSettings.h:603
; -- so it applies at SetByProjectSetting (0x04) and the editor's
; Project Settings > Rendering > Reflections page keeps showing the true value
; AND can still change it. Do NOT move this line into [ConsoleVariables]: that
; pins at SetByConsoleVariablesIni (0x0A) and FConsoleVariableBase::CanChange
; would then silently refuse the editor's own UI edit, so the value on screen
; would stop matching the value in effect. The shadow block's reason for using
; [ConsoleVariables] does not apply here either -- no scalability group sets
; r.ReflectionMethod, so there is nothing to defend against.
;
; OWNER DECISION 2026-08-24: SSR STAYS ON. He reviewed the 2026-08-24
; render-frame split legs, where an arm with r.ReflectionMethod=0,
; r.Shadow.UseOctreeForCulling=1, r.Shadow.CSM.MaxCascades=4 and
; voxel.Sky.VolumetricFog=0 applied TOGETHER moved the parked render floor
; 8.74 -> 8.52 ms (setupOther 7.53 -> 7.35 ms), the moving frame
; 20.67 -> 19.34 ms and p50 20.50 -> 20.10 ms. That is 0.18 ms off a 7.53 ms
; parked floor -- and the parked floor is very nearly all engine scene-renderer
; graph construction, which none of these four settings is. The individual
; contribution of SSR was NOT separated from the other three, so NO SSR COST
; FIGURE EXISTS and none should be quoted from that pair. His reading of it:
; reflections are cheap enough to keep. THIS IS A SETTLED DECISION, NOT A
; PENDING RECOMMENDATION -- do not "optimise" this to 0 without a fresh owner
; ruling on a fresh A/B.
;
; TWO FACTS A LATER READER WILL WANT. Both verified 2026-08-24; neither is a
; reason to change anything today:
;   * SSR is running at its HIGHEST quality here, also without anyone choosing
;     it. sg.ReflectionQuality=3 in Saved/Config selects [ReflectionQuality@3]
;     (BaseScalability.ini:536), which is r.SSR.Quality=3 with
;     r.SSR.HalfResSceneColor=0, i.e. full-resolution. Reflections are the
;     opposite case to the shadow knobs in [ConsoleVariables] above: that
;     group is one of the few the stale low preset left HIGH.
;   * The neighbouring method cvar is NOT symmetric with this one.
;     r.DynamicGlobalIlluminationMethod defaults to 0 = None
;     (IndirectLightRendering.cpp:93), so the engine's dynamic GI is off while
;     its reflections are on, and both states are inherited rather than stated.
;     That combination is fine here -- this project supplies its own GI
;     (VoxelGI.cpp) and has no mesh distance fields for Lumen to trace, see the
;     SingleLayerWater note above -- and it is recorded so the asymmetry reads
;     as known rather than as another accident.
;
; TO A/B IT, both arms from one binary, no rebuild:
;   -ExecCmds="r.ReflectionMethod 0"   ; reflection captures + skylight only
;   -ExecCmds="r.ReflectionMethod 2"   ; shipped
; SetByCommandline (0x0D) outranks SetByProjectSetting (0x04), so the override
; takes. Shoot the SAME settled pose both ways and hand the owner the pair --
; wet rock, water margins and anything with low roughness are where SSR shows,
; and a shot without them will show no difference and prove nothing. Do not
; read a perf verdict off a moving capture: the 2026-08-24 legs already show
; the moving frame moving for several reasons at once, of which this cvar was
; only one.
r.ReflectionMethod=2
