[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; UE 5.8 native MCP server (ADR-0001 tooling): auto-start on editor launch so
; Claude Code can connect to http://127.0.0.1:8000/mcp without manual steps.
bAutoStartServer=True
ServerPortNumber=8000
ServerUrlPath=/mcp

[/Script/UnrealEd.EditorPerformanceSettings]
; PIE MUST NOT BE THROTTLED WHEN THE EDITOR WINDOW LOSES FOCUS.
;
; This is on by default and it cost a whole debugging session on 2026-08-22.
; The symptom is indistinguishable from a streaming bug: press Stop, press
; Play, and terrain never appears. The log showed frameMs=333.33 repeated
; EXACTLY -- 1/3 of a second, a hard 3 FPS cap -- with all of it in
; elsewhereMs, outside every voxel system, while the voxel streaming tick sat
; at 6%% of wall and simply was not being called often enough to stream
; anything. Chunks/s collapsed to ~254 against ~2000 in a focused session.
;
; A voxel world streams on the game thread, so a frame rate cap IS a streaming
; cap here in a way it is not for a static scene. Turning this off is what
; makes an unfocused PIE session measure the same as a focused one.
bThrottleCPUWhenNotForeground=False
