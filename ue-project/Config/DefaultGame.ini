[/Script/VoxelEarth.VoxelWorldSubsystem]
; Standing default tile source, so ORDINARY launches (double-click the
; .uproject, plain PIE, an IDE debug session) boot on the real diffusion
; terrain instead of the synthetic sampler. Before this existed, forgetting
; -VoxelTileDir silently produced a plausible-looking fake world -- see the
; precedence comment in VoxelWorldSubsystem::Initialize.
;
; -VoxelTileDir=<path> on the command line still overrides this.
;
; Path is RELATIVE TO Content/ on purpose: tile-cache/ is gitignored, so an
; absolute D:\ path here would hardcode one machine's drive layout into a
; checked-in config. Seed 20260719 == hex 000000000135276f (the directory
; name); it is already VoxelWorldSubsystem::DefaultSeed, so no -VoxelSeed is
; needed to match. Re-create this directory per docs/pod-bringup-commands.md
; (or extract tile-cache-seed20260719.tar.gz at the repo root).
;
; If the directory is missing or loads zero tiles, MakeTileSampler logs an
; Error and falls back to the synthetic sampler -- it never fails silently,
; and the in-game HUD tile-source row (F3, mode 2) reports which is live.
; 2026-08-01: repointed from terrain-diffusion-unlabeled-3e11cf157a836c70 to
; the world generated after the conditioning rebuild. The old namespace is
; still on disk and still loads -- it is simply a different, and worse, world:
; its climate came from hand-written latitude formulas standing in for
; WorldClim, so it contained NO hot-and-arid land anywhere and could not
; produce a desert at any biome threshold.
;
;  289 tiles (17x17, -16..0 on both axes), seed 20260719. Measured on the
; delivered bytes: peaks to 6,021 m, hot&arid land 11-16% depending on the
; sample, DESERT ~10% of land against Earth's ~8.6%.
;
; 2026-08-21: REPOINTED FROM D:/vox-wet-cache TO THE CONSOLIDATED CACHE.
; The coarse tier and the fine tier used to live under different roots, so this
; line and DefaultFineTileDir below named two different caches -- which is the
; same split that made a bake impossible to address with one --cache-dir. The
; 289 coarse tiles were copied into D:/voxelsim/tile-cache and verified
; byte-identical (all 289 sha256 equal, and the L1 flow superblock fingerprint
; recomputed from the new location still reads 066cf1d469ed, which is the value
; stored in the .vxfl headers the shipped fine tiles were baked against).
; So this changes WHERE the engine reads coarse from, not WHAT it reads.
; D:/vox-wet-cache and D:/vox-trunk-cache still hold identical copies; they are
; now redundant rather than authoritative. See docs/world-generation-architecture.md.
DefaultTileDir=D:/voxelsim/tile-cache/terrain-diffusion-unlabeled-80b9ca451a23eae4/000000000135276f/s1

; Phase 2 FINE TIER (1.875 m/px), the standing default for the same reason
; DefaultTileDir is: the plan makes the fine tier a hard dependency, not a
; progressive enhancement, so an ordinary launch should render the world the
; game actually ships rather than the 30 m tier it is amplified from.
;
; This was command-line-only until 2026-08-01 on the argument that enabling it
; CHANGES THE WORLD (30 m -> 1.875 m pitch selects a different octave ladder in
; amplifier.cpp) and so should never be silent. The change keeps that concern
; and drops the silence: every run logs "Fine tier ENABLED: ... pitch=1875
; mm/px" with root, provider, seed, ring and budget, and the HUD carries a tier
; row -- so a bench A/B can still tell its two arms apart at a glance.
;
; To force the COARSE tier for a comparison, pass an empty command-line value:
;     -VoxelFineTileDir=
; A present-but-empty switch beats the ini; an absent switch falls through.
;
; UNLIKE DefaultTileDir, this names the cache ROOT, not a leaf: the streamer
; formats <provider_id>/<seed:016x>/s16/<x>_<y>.vxtl itself because those
; segments are part of its LRU cache key. Relative to Content/, same rule.
; RE-ENABLED 2026-08-02 once a bake had actually written fine tiles.
;
; WORTH KNOWING, because it cost three failed captures: with the fine tier
; enabled and NO tiles on disk, the residency gate is FATAL in unattended
; runs. That is by design -- answering a fine-tier query with sea level would
; fabricate terrain no other client computes -- but it means an absent fine
; tier is NOT a graceful fallback to the coarse tier. It is a hard stop. If a
; capture or leg dies in VoxelFineTileStreamer.cpp, check that tiles exist for
; the id below before assuming anything else is wrong.
; PAIRED WITH DefaultFineTileProviderId BELOW -- CHANGE BOTH OR NEITHER.
; The provider id is a FINGERPRINT OF THE BAKE's constants (bake_ver, stage
; order, geometry, physical constants) computed by terrain-service; the engine
; only reads this literal. So the id moves every time the bake changes, and a
; root without its matching id is a cross-product that has never existed on
; disk -- which is exactly the fatal gate leak that cost three capture runs on
; 2026-08-18. Resolve the current pair with:
;   python terrain-service/tools/resolve_fine_namespace.py <cache-root>
DefaultFineTileDir=D:/voxelsim/tile-cache

; MUST match the provider_id the tiles were encoded under or every tile is
; refused as an identity mismatch -- "validate, never trust". Counted and
; reported as identityMismatch in the 5 s fine-tier log line, never silent.
;
; Taken from the bake's own output, NOT derived by hand: fine_provider_id()
; folds BAKE_VERSION and the bake fingerprint into the coarse provider_id, so
; the "-b2dffc351" suffix is a fact about the bake, not something to compute.
; Re-read it from the bake log after any BAKE_VERSION or constants change.
;
; COVERAGE IS PARTIAL -- 15 of 289 tiles are baked, so any camera elsewhere
; will trip the fatal residency gate above. Bake the tile you are about to
; look at, or comment out DefaultFineTileDir for a coarse run. As of
; 2026-08-19 the baked set under the id below is:
;   (-11,-6) (-15,-7) (-3,-4) (-3,-5) (-4,-4) (-4,-5) (-5,-11) (-5,-4)
;   (-5,-5) (-5,-7) (-6,-11) (-7,-12) (-7,-5) (-7,-7) (-8,-11)
;
; The previous list here described -b2dffc351's 17 tiles and had been stale
; since the 2026-08-17 bake; that namespace and eleven other obsolete ones were
; deleted 2026-08-19 (21.29 GB -> 6.47 GB), leaving only the id below. Re-list
; with: python terrain-service/tools/resolve_fine_namespace.py
;                --cache-dir D:/voxelsim/tile-cache --seed 20260719 --newest
;
; A GOOD MEASUREMENT SITE, since the baked set is scattered: -VoxelSpawnAt is in
; METRES, fine pixels are 1.875 m, and a tile is 8192 px = 15.36 km. The four
; tiles (-4,-4) (-4,-5) (-5,-4) (-5,-5) all exist, so spawning at their shared
; corner -- -VoxelSpawnAt=-61440,-61440 -- is covered in every quadrant. The
; historical leg spawn -84480,53760 needs tile (-6,3) and is NOT baked: a leg
; there dies at VoxelFineTileStreamer.cpp:891 rather than degrading.
;
; AND A COLUMN NEAR A TILE EDGE NEEDS ITS NEIGHBOURS, not just its own tile.
; The 4,096 m outer ring makes a tile-CENTRE column self-contained (7,680 m to
; any edge), but the beach vista sat 240 m from a corner and needed all four
; quadrants. Budget the extra bakes when picking an off-centre camera.
; bake_ver 28 (the five placement planes). Its predecessor -bdcab4bed was
; bake_ver 27 and lives under D:/vox-wet-cache; that pair is still
; self-consistent, it is simply an older world.
DefaultFineTileProviderId=terrain-diffusion-unlabeled-80b9ca451a23eae4-b19d281fd

; --- Front-end assets (docs/front-end-plan.md) -------------------------------
;
; Content/UI holds the menu's typeface and its six background JPEGs as PLAIN
; FILES, not .uasset. The Slate front end loads them by filesystem path at
; runtime (FStandaloneCompositeFont for the font, an explicit IImageWrapper
; decode for the images -- see Source/VoxelEarthUI/VoxelUIAssetLibrary.cpp for
; why the decode is done by hand rather than through a Slate style set).
;
; Nothing in the asset registry references them, so the cooker would not stage
; them on its own and a packaged build would boot to a menu with no art and no
; font. This line is what puts them in the build. NonUFS because they are read
; through IFileManager/FFileHelper as ordinary files rather than through the
; pak-aware UFS path.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysStageAsNonUFS=(Path="Content/UI")
