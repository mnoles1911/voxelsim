; Front-end layout overrides.
;
; WHY THIS FILE EXISTS. Every number the main menu and loading screen position
; anything with lives in FVoxelMenuLayout (Source/VoxelEarthUI/VoxelUITheme.h)
; and is read from here at startup. That is the project's answer to a real
; constraint: there is no editor available to most people who will want to
; nudge this screen, and a Slate widget tree is no more designer-editable than
; a C++-built UMG one would be -- only a real Widget Blueprint is, and
; authoring one needs the editor. So the next best thing is that moving the
; title up four pixels is a text edit and a relaunch, with no compiler.
;
; KEY NAMES ARE THE C++ MEMBER NAMES, exactly. VoxelUITheme.cpp pairs the two
; with a macro on #Member, so a renamed member is a compile error rather than
; an ini key that silently stops working. Absent keys keep their defaults, so
; an empty file (this one) is the normal case; the log says how many overrides
; were applied whenever there is at least one.
;
; The defaults are the values the Godot build actually uses, NOT the HTML
; mock's -- the two disagree in three visible ways and the shipped screen is
; the thing being cloned. See docs/front-end-plan.md.

[VoxelUI.Layout]
; Examples, commented out. Uncomment and edit to override.
; TitleFontSize=84
; MainColumnSeparation=14
; QuitSpacer=80
; BackgroundTintAlpha=0.55
; LoadingBarWidth=520
; QuipRotate=2.5
