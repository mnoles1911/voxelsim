; Editor-only settings. Nothing here affects a cooked build.

[TextureImporter]
; RADIANCE .HDR IMPORTS AS A 2D TEXTURE, NEVER A LATLONG CUBE MAP.
;
; UE 5.8 asks "is this .hdr a longlat cubemap?" for EVERY .hdr file regardless
; of its dimensions (EditorFactories.cpp:3505-3593) and answers it from this
; key, from a modal dialog, or from a hard-coded legacy default. Two of those
; three answers have already cost this project real time in one night:
;
;   * The NIGHT SKY rendered nothing, because ssm_HDR_blue_nebulae_2.hdr came
;     in as a UTextureCube while M_NightSky samples a flat 2D equirect. The log
;     said "HDR Image imported as LongLat cube map" and was skimmed past twice.
;   * The BATHYMETRY INFO TEXTURE (create_bathy_info_texture.py, a 512x512
;     float RGBA scratch target) imported as a UTextureCube and died on
;     set_editor_property("address_x"), which TextureCube does not have.
;
; The behaviour is inconsistent in a way that makes it hard to reason about at
; the call site: with -unattended the dialog returns its NO default and you get
; a UTexture2D, but with -RUNNINGUNATTENDEDSCRIPT the engine hard-codes "yes,
; latlong cubemap" (EditorFactories.cpp:3540-3542) -- so the same script gives
; different asset CLASSES depending on which unattended flag the caller used.
;
; Setting it to 0 here answers the question once, for every importer and every
; command line, instead of every caller having to know the flag matrix. This
; project has no latlong-cubemap .hdr content: the sky dome samples a flat
; equirect by design (see create_sky_material.py) and every other .hdr here is
; a scratch buffer. If cube-map content is ever wanted, import it deliberately
; rather than by re-enabling a global default.
LoadHdrAsLongLatCubemap=0
