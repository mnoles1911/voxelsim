<!doctype html>
<!-- @dsCard group="Brand" name="Voxelmark Loading Screen" subtitle="Flipping hourglass loop, rotating survival lines, version stamp" viewport="2560x1440" -->
<html lang="en">
<head>
<style id="ui-scale-2k">/* authored at 1080p, rendered for a 1440p / 2K screen */html{zoom:1.33333}</style>
<meta charset="utf-8" />
<title>Voxelmark — Loading</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="menus_shared.css" />
<style>
  body{
    font-family:var(--hand);color:var(--parchment);background:#000;
    overflow:hidden;user-select:none;
  }
  a{color:var(--warm-highlight);text-decoration:none}a:hover{color:var(--parchment)}
  .bg{
    position:absolute;inset:0;
    background:url("assets/menu_backgrounds/cave_background1.jpg") center/cover no-repeat;
  }
  .tint{position:absolute;inset:0;background:rgba(0,0,0,0.62)}
  .vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 240px rgba(0,0,0,0.7)}
  .grain{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,180,80,0.018) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }

  .stack{
    position:absolute;left:50%;top:33%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:18px;
    width:min(780px, calc((100vw - 40px) / 1.33333));
  }

  /* =========================================================
     SMALL HOURGLASS — ~1/4 prior size.
     hg element 40 × 60 px. Particles are 1.5px squares falling
     through the waist into a growing mound at the bottom.
     ========================================================= */
  .hg-stage{
    position:relative;
    perspective:700px;
    width:72px;height:79px;
    display:grid;place-items:center;
    margin-bottom:4px;
  }
  /* the frame that physically turns over */
  .hg-flip{
    --flip:0deg;
    position:relative;
    width:46px;height:69px;
    transform-style:preserve-3d;
    transform:rotateX(-10deg) rotateY(-14deg) rotateZ(var(--flip));
    transition:transform .85s cubic-bezier(.55,.02,.35,1);
  }
  .hg{
    position:relative;
    width:46px;height:69px;
    transform-style:preserve-3d;
    animation:hgBob 5.2s ease-in-out infinite;
  }
  @keyframes hgBob{
    0%,100%{ transform:translateY(0) }
    50%   { transform:translateY(-2px) }
  }

  /* frame + glass, drawn as overlaid SVG layers */
  .hg-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .hg-layer.behind{z-index:0}
  .hg-layer.front{z-index:3}

  /* particle field — overlaid SVG, viewBox 40x60 */
  .particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;transform:rotate(var(--counter,0deg))}
  .particles{z-index:2}
  .particles rect{shape-rendering:auto}

  /* shadow */
  .hg-shadow{
    position:absolute;left:50%;bottom:0;width:55px;height:5px;
    background:radial-gradient(ellipse,rgba(0,0,0,0.55) 0%,transparent 70%);
    transform:translateX(-50%);
    animation:shadowBob 5.2s ease-in-out infinite;
  }
  @keyframes shadowBob{
    0%,100%{transform:translateX(-50%) scale(1,1);opacity:0.55}
    50%   {transform:translateX(-50%) scale(0.9,0.7);opacity:0.4}
  }

  /* =========================================================
     TEXT
     ========================================================= */
  .title{
    font-family:var(--serif);font-size:40px;letter-spacing:10px;color:var(--warm-highlight);
    text-shadow:3px 3px 0 #000, 0 0 18px rgba(0,0,0,0.9);
    line-height:1;
  }
  .msg{
    font-family:var(--hand);font-style:italic;font-size:20px;color:var(--parchment);
    text-shadow:2px 2px 0 #000;text-align:center;line-height:1.3;
    min-height:48px;max-width:min(680px, calc((100vw - 60px) / 1.33333));
    transition:opacity .4s;
  }
  .version-stamp{
    position:absolute;left:36px;bottom:24px;
    font-family:var(--serif);font-size:16px;letter-spacing:3px;
    color:rgba(232,217,176,0.32);
    text-shadow:1px 1px 0 rgba(0,0,0,0.8);
  }
  .tip{
    position:absolute;left:50%;bottom:56px;transform:translateX(-50%);
    font-family:var(--hand);font-style:italic;font-size:14px;color:rgba(230,213,168,0.55);
    text-align:center;max-width:min(640px, calc((100vw - 60px) / 1.33333));padding:0 20px;
  }
  .tip b{font-style:normal;font-family:var(--serif);letter-spacing:2px;color:var(--warm-highlight)}
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="tint"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="stack">

    <div class="hg-stage">
      <div class="hg-shadow"></div>
      <div class="hg-flip" id="hgFlip">
      <div class="hg" id="hg">
        <!-- BEHIND: rear posts, glass interior, cap undersides -->
        <svg class="hg-layer behind" viewBox="0 0 40 60" preserveAspectRatio="none">
          <defs>
            <linearGradient id="brassV" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f0cf8e"/><stop offset="0.18" stop-color="#d8a050"/>
              <stop offset="0.55" stop-color="#a87320"/><stop offset="0.86" stop-color="#6b4520"/>
              <stop offset="1" stop-color="#3a2410"/>
            </linearGradient>
            <linearGradient id="brassH" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#5c3a18"/><stop offset="0.2" stop-color="#c99548"/>
              <stop offset="0.42" stop-color="#f2dba4"/><stop offset="0.62" stop-color="#b8842f"/>
              <stop offset="0.85" stop-color="#7a5220"/><stop offset="1" stop-color="#4a2e12"/>
            </linearGradient>
            <linearGradient id="glassBody" x1="0.1" y1="0" x2="0.95" y2="1">
              <stop offset="0" stop-color="#cfe2e0" stop-opacity="0.20"/>
              <stop offset="0.35" stop-color="#8fb0b4" stop-opacity="0.10"/>
              <stop offset="0.72" stop-color="#20313a" stop-opacity="0.20"/>
              <stop offset="1" stop-color="#0d1418" stop-opacity="0.34"/>
            </linearGradient>
          </defs>
          <!-- rear posts, dimmed for depth -->
          <g opacity="0.5" filter="none">
            <rect x="4.6" y="3.4" width="1.5" height="53.2" rx="0.6" fill="url(#brassV)"/>
            <rect x="33.9" y="3.4" width="1.5" height="53.2" rx="0.6" fill="url(#brassV)"/>
          </g>
          <!-- glass interior (the volume the sand sits in) -->
          <path d="M6.4,4.2 C6.4,15.6 11.4,23.4 18.9,28.4 L18.9,31.6 C11.4,36.6 6.4,44.4 6.4,55.8 L33.6,55.8 C33.6,44.4 28.6,36.6 21.1,31.6 L21.1,28.4 C28.6,23.4 33.6,15.6 33.6,4.2 Z"
                fill="url(#glassBody)"/>
        </svg>

        <!-- SAND: clipped to the glass interior so piles take the bulb's curve -->
        <svg class="hg-layer particles" id="particles" viewBox="0 0 40 60" preserveAspectRatio="none">
          <defs>
            <clipPath id="bulbClip">
              <path d="M6.4,4.2 C6.4,15.6 11.4,23.4 18.9,28.4 L18.9,31.6 C11.4,36.6 6.4,44.4 6.4,55.8 L33.6,55.8 C33.6,44.4 28.6,36.6 21.1,31.6 L21.1,28.4 C28.6,23.4 33.6,15.6 33.6,4.2 Z"/>
            </clipPath>
            <linearGradient id="sandTop" x1="0.15" y1="0" x2="0.9" y2="1">
              <stop offset="0" stop-color="#f2d79a"/><stop offset="0.4" stop-color="#dcb264"/>
              <stop offset="1" stop-color="#a87a34"/>
            </linearGradient>
            <linearGradient id="sandBot" x1="0.15" y1="0" x2="0.9" y2="1">
              <stop offset="0" stop-color="#e0bc78"/><stop offset="0.45" stop-color="#bf9247"/>
              <stop offset="1" stop-color="#8a5f22"/>
            </linearGradient>
          </defs>
          <g clip-path="url(#bulbClip)">
            <polygon id="topSand" points="0.5,0.5 39.5,0.5 20,29.5" fill="url(#sandTop)"/>
            <line id="topSurface" x1="0.5" y1="0.5" x2="39.5" y2="0.5" stroke="#fff0c4" stroke-width="0.5" opacity="0.75"/>
            <polygon id="botMound" points="20,30 20,30 20,30" fill="url(#sandBot)"/>
            <g id="grainGroup"></g>
          </g>
        </svg>

        <!-- FRONT: glass rim, speculars, front posts, brass caps -->
        <svg class="hg-layer front" viewBox="0 0 40 60" preserveAspectRatio="none">
          <defs>
            <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#eaf4f2" stop-opacity="0.55"/>
              <stop offset="0.45" stop-color="#9fb8ba" stop-opacity="0.22"/>
              <stop offset="1" stop-color="#0f171b" stop-opacity="0.5"/>
            </linearGradient>
          </defs>
          <!-- glass wall -->
          <path d="M6.4,4.2 C6.4,15.6 11.4,23.4 18.9,28.4 L18.9,31.6 C11.4,36.6 6.4,44.4 6.4,55.8 L33.6,55.8 C33.6,44.4 28.6,36.6 21.1,31.6 L21.1,28.4 C28.6,23.4 33.6,15.6 33.6,4.2 Z"
                fill="none" stroke="url(#rim)" stroke-width="0.85"/>
          <!-- left specular streak -->
          <path d="M9.3,6 C9.3,16 13.4,22.6 18.2,26.6" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="0.7" stroke-linecap="round"/>
          <path d="M9.3,54 C9.3,44 13.4,37.4 18.2,33.4" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.7" stroke-linecap="round"/>
          <!-- faint right-edge falloff -->
          <path d="M31.2,6 C31.2,16.4 27.2,23 22.4,27" fill="none" stroke="#0b1114" stroke-opacity="0.35" stroke-width="0.9"/>
          <path d="M31.2,54 C31.2,43.6 27.2,37 22.4,33" fill="none" stroke="#0b1114" stroke-opacity="0.3" stroke-width="0.9"/>
          <!-- neck collar -->
          <rect x="18.3" y="28.9" width="3.4" height="2.2" fill="#1a1208" opacity="0.55"/>
          <rect x="18.3" y="28.9" width="3.4" height="0.5" fill="#f2dba4" opacity="0.35"/>
          <!-- front posts -->
          <rect x="3.5" y="3.4" width="2.1" height="53.2" rx="0.8" fill="url(#brassV)" stroke="#241505" stroke-width="0.35"/>
          <rect x="34.4" y="3.4" width="2.1" height="53.2" rx="0.8" fill="url(#brassV)" stroke="#241505" stroke-width="0.35"/>
          <rect x="4.05" y="4" width="0.55" height="52" fill="#ffe6ad" opacity="0.4"/>
          <rect x="34.95" y="4" width="0.55" height="52" fill="#ffe6ad" opacity="0.3"/>
          <!-- brass end plates: bevel + face + lip -->
          <g stroke="#1c1004" stroke-width="0.35">
            <rect x="1.6" y="0.5" width="36.8" height="2.2" rx="0.7" fill="url(#brassH)"/>
            <rect x="3.2" y="2.6" width="33.6" height="1.5" rx="0.5" fill="#8a5c22"/>
            <rect x="1.6" y="57.3" width="36.8" height="2.2" rx="0.7" fill="url(#brassH)"/>
            <rect x="3.2" y="55.9" width="33.6" height="1.5" rx="0.5" fill="#8a5c22"/>
          </g>
          <rect x="2.2" y="0.8" width="35.6" height="0.5" fill="#ffeec2" opacity="0.5"/>
          <rect x="2.2" y="58.7" width="35.6" height="0.5" fill="#3a2410" opacity="0.6"/>
        </svg>
      </div>
      </div>
    </div>

    <div class="title">LOADING</div>
    <div class="msg" id="msg">Reticulating cave splines</div>

  </div>

  <div class="tip"><b>TIP</b> &nbsp; Press <b>Q</b> / <b>E</b> to cycle quick slots — your shovel won't break stone, only dirt.</div>

  <div class="version-stamp">DEV BUILD v0.18.2</div>

<script>
const TIPS = [
  "Reticulating cave splines",
  "Convincing the snow to fall convincingly",
  "Teaching wolves to travel in packs, unfortunately",
  "Deciding how cold is too cold",
  "Burying ore just deep enough to be annoying",
  "Counting trees. Recounting them. Someone is already chopping",
  "Giving the night something to howl about",
  "Asking the wind to please stop putting out torches",
  "Hiding a cave entrance behind exactly one bush",
  "Reminding the weather that you have no roof yet",
  "Stoking a campfire that will not last the night",
  "Distributing loose rocks with great care",
  "Persuading the mountain to contain iron",
  "Teaching things in the dark to wait patiently",
  "Making sure the good building spot is very far away",
  "Rolling for rain. Rolling again. Still rain",
  "Placing your first grave marker, just in case",
  "Letting something large learn your scent"
];

const SVGNS = "http://www.w3.org/2000/svg";
const topSand = document.getElementById('topSand');
const topSurface = document.getElementById('topSurface');
const botMound = document.getElementById('botMound');
const grainGroup = document.getElementById('grainGroup');
const msgEl = document.getElementById('msg');
const hgFlip = document.getElementById('hgFlip');
const particlesEl = document.getElementById('particles');

/* One chamber drains in FILL_MS, the glass rests, then turns over. */
const FILL_MS = 6500;   // 5-8s per pass
const REST_MS = 420;    // beat before the turn
const FLIP_MS = 850;    // matches the CSS transition
let flipDeg = 0;
let phase = 'fill';     // fill → rest → flip
let phaseT = 0;

/* ========= Particle simulation =========
   Coordinate space is the SVG viewBox 40x60.
   Top half: 0..30 (waist at y=30, x=20).
   Bottom half: 30..60.
*/
const grains = [];
const MAX_GRAINS = 38;
let progress = 0;
let dropAccum = 0;

function spawnGrain(){
  // spawn at the waist with small horizontal jitter
  const g = {
    x: 20 + (Math.random() - 0.5) * 0.6,
    y: 30,
    vx: (Math.random() - 0.5) * 0.10,
    vy: 0.18 + Math.random() * 0.10,
    size: Math.random() < 0.4 ? 0.9 : 0.7,
    color: Math.random() < 0.5 ? '#F5D06E' : '#E8B850'
  };
  grains.push(g);
}

function moundApexY(p){
  // floor at 60, apex rises toward waist (30) as p→1
  return 60 - p * 30;
}

function moundContains(x, y, p){
  // Triangle: floor (0,60)-(40,60), apex at (20, apexY).
  const apexY = moundApexY(p);
  if (y < apexY) return false;
  if (y > 60) return true;
  // mound half-width at this y, lerping from 0 (apex) to 20 (floor)
  const t = (y - apexY) / (60 - apexY);
  const halfW = t * 20;
  return Math.abs(x - 20) <= halfW;
}

function tickGrains(){
  for (let i = grains.length - 1; i >= 0; i--){
    const g = grains[i];
    g.vy += 0.012;     // gravity
    g.x += g.vx;
    g.y += g.vy;
    // remove on contact with mound or floor
    if (g.y >= 60 || moundContains(g.x, g.y, progress)){
      grains.splice(i, 1);
    }
  }
}

function renderTopSand(p){
  // top sand surface y goes from 0.5 (full) to 29 (almost empty)
  const ySurf = 0.5 + p * 28.5;
  const halfW = (1 - p) * 19.5;
  const xL = 20 - halfW;
  const xR = 20 + halfW;
  topSand.setAttribute('points', `${xL},${ySurf} ${xR},${ySurf} 20,29.5`);
  topSurface.setAttribute('x1', xL);
  topSurface.setAttribute('y1', ySurf);
  topSurface.setAttribute('x2', xR);
  topSurface.setAttribute('y2', ySurf);
  topSurface.style.opacity = p < 0.97 ? 0.7 : 0;
}

function renderMound(p){
  if (p < 0.005){
    botMound.setAttribute('points', '20,30 20,30 20,30');
    return;
  }
  const apexY = moundApexY(p);
  const halfW = p * 20;
  // Triangle: apex + base corners, with slight settling bevel near apex
  const xL = 20 - halfW;
  const xR = 20 + halfW;
  botMound.setAttribute('points',
    `${xL},60 ${xR},60 ${20 + halfW*0.06},${apexY+0.5} 20,${apexY} ${20 - halfW*0.06},${apexY+0.5}`);
}

function renderGrains(){
  // diff-render: rebuild the group cheaply
  while (grainGroup.firstChild) grainGroup.removeChild(grainGroup.firstChild);
  for (const g of grains){
    const r = document.createElementNS(SVGNS, 'rect');
    r.setAttribute('x', g.x - g.size/2);
    r.setAttribute('y', g.y - g.size/2);
    r.setAttribute('width', g.size);
    r.setAttribute('height', g.size);
    r.setAttribute('fill', g.color);
    grainGroup.appendChild(r);
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(40, now - last); last = now;

  phaseT += dt;
  if (phase === 'fill'){
    progress = Math.min(1, phaseT / FILL_MS);
    if (progress >= 1){ phase = 'rest'; phaseT = 0; }
  } else if (phase === 'rest'){
    if (phaseT >= REST_MS){
      // turn the glass over — the settled mound rotates with the frame,
      // ending up as a full upper chamber
      phase = 'flip'; phaseT = 0;
      flipDeg += 180;
      hgFlip.style.setProperty('--flip', flipDeg + 'deg');
      rotateTip();   // one line per full turn of the glass
    }
  } else if (phase === 'flip'){
    if (phaseT >= FLIP_MS){
      // counter-rotate the sand so it falls downward again, and refill the top
      particlesEl.style.setProperty('--counter', (-flipDeg) + 'deg');
      grains.length = 0;
      progress = 0;
      phase = 'fill'; phaseT = 0;
    }
  }

  // spawn grains while sand is falling
  if (phase === 'fill' && progress > 0.005 && progress < 0.995 && grains.length < MAX_GRAINS){
    dropAccum += dt;
    const interval = 32; // ms between spawns; bursty during mid-progress
    while (dropAccum >= interval){
      dropAccum -= interval;
      spawnGrain();
      if (progress > 0.2 && progress < 0.8 && Math.random() < 0.5) spawnGrain();
    }
  }

  if (phase === 'fill') tickGrains();
  renderTopSand(Math.min(progress, 1));
  renderMound(Math.min(progress, 1));
  renderGrains();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

let tipIdx = 0;
function rotateTip(){
  tipIdx = (tipIdx + 1) % TIPS.length;
  msgEl.style.opacity = 0;
  setTimeout(()=>{ msgEl.textContent = TIPS[tipIdx]; msgEl.style.opacity = 1; }, 400);
}
// the line changes once per full turn of the glass — fired from the flip phase
</script>
</body>
</html>
