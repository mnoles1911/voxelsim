<!doctype html>
<!-- @dsCard group="Brand" name="Voxelmark Death Screen" subtitle="You died — cause-of-death quip, respawn and quit" viewport="2560x1440" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Voxelmark — You Died</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="menus_shared.css" />
<style>
  body{font-family:var(--hand);color:var(--parchment);background:#000;overflow:hidden;user-select:none}

  /* Fit-stage scaler — the design lives in a fixed 2560×1440 frame
     (1920×1080 authored, scaled ×1.333) and is scaled uniformly to fit any
     viewport, letterboxed on black. Same pattern as the other full-screen
     Voxelmark assets. */
  .fit-viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .stage{position:relative;width:1920px;height:1080px;zoom:1.33333;transform-origin:center center;overflow:hidden;background:#000;flex-shrink:0}

  /* the world, drained of colour and fading out under the message */
  .world{position:absolute;inset:0;background:linear-gradient(180deg,#14100c 0%,#1a1410 40%,#0e0a07 100%);filter:grayscale(1) brightness(0.35);animation:worldFade 2.6s ease-out both}
  @keyframes worldFade{0%{filter:grayscale(0.2) brightness(0.9)}100%{filter:grayscale(1) brightness(0.28)}}
  .fade{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 45%, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.88) 55%, #000 100%);animation:inkIn 2.2s ease-out both}
  @keyframes inkIn{0%{opacity:0}100%{opacity:1}}
  .grain{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,180,80,0.02) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}

  .stack{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:1040px;display:flex;flex-direction:column;align-items:center;text-align:center}

  /* YOU DIED */
  .died{font-family:var(--serif);font-size:104px;line-height:1;letter-spacing:14px;color:var(--blood-bright);text-shadow:0 0 40px rgba(142,31,20,0.75),4px 4px 0 #000,0 0 90px rgba(0,0,0,0.9);animation:diedIn 1.5s cubic-bezier(.2,.8,.25,1) both}
  @keyframes diedIn{0%{opacity:0;transform:scale(1.14);letter-spacing:34px}100%{opacity:1;transform:scale(1);letter-spacing:14px}}
  .rule{width:520px;max-width:100%;height:2px;margin:22px 0 18px;background:linear-gradient(90deg,transparent,var(--blood) 22%,var(--blood-bright) 50%,var(--blood) 78%,transparent);animation:ruleIn 1.6s .5s ease-out both}
  @keyframes ruleIn{0%{opacity:0;transform:scaleX(0.2)}100%{opacity:1;transform:scaleX(1)}}

  /* the quip */
  .quip{font-family:var(--hand);font-style:italic;font-size:26px;line-height:1.35;color:var(--parchment);text-shadow:0 2px 0 #000,0 0 24px rgba(0,0,0,0.9);max-width:720px;min-height:70px;animation:quipIn 1.4s .9s ease-out both}
  @keyframes quipIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
  .stamp{font-family:var(--serif);font-size:12px;letter-spacing:5px;color:var(--ink-mute);margin-top:26px;animation:quipIn 1.4s 1.3s ease-out both}

  /* buttons, bottom of the screen */
  .actions{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;align-items:center;gap:18px;animation:fadeUp 1.4s 1.6s ease-out both}
  @keyframes fadeUp{0%{opacity:0}100%{opacity:1}}
  .btn{font-family:var(--serif);font-size:17px;letter-spacing:4px;color:var(--parchment);background:linear-gradient(180deg,var(--leather-1),var(--leather-2));border:2px solid #000;box-shadow:inset 0 0 0 1px var(--leather-edge),0 4px 14px rgba(0,0,0,0.6);padding:13px 40px;cursor:pointer;text-shadow:1px 1px 0 #000;transition:color .14s,box-shadow .14s}
  .btn:hover{color:var(--warm-highlight);box-shadow:inset 0 0 0 1px var(--warm-highlight),0 4px 18px rgba(0,0,0,0.7)}
  .btn.primary{background:linear-gradient(180deg,#6a3a14,#3a1e08)}
  .btn.primary:hover{background:linear-gradient(180deg,#8a4e18,#4a260a)}
  .btn.quit{background:linear-gradient(180deg,#6a3a14,#3a1e08)}
  .btn.quit:hover{background:linear-gradient(180deg,#8a4e18,#4a260a)}
  .version-stamp{position:absolute;left:48px;bottom:32px;font-family:var(--serif);font-size:16px;letter-spacing:3px;color:rgba(232,217,176,0.32);text-shadow:1px 1px 0 rgba(0,0,0,0.8)}
  a{color:var(--warm-highlight)}a:hover{color:var(--parchment)}
</style>
</head>
<body>
  <div class="fit-viewport">
    <div class="stage" id="stage">
      <div class="world"></div>
  <div class="fade"></div>
  <div class="grain"></div>

  <div class="stack">
    <div class="died">YOU DIED</div>
    <div class="rule"></div>
    <div class="quip" id="quip"></div>
    <div class="stamp" id="stamp">DAY 12 · SUMMER, 18TH YEAR OF THE SECOND AGE</div>
  </div>

  <div class="actions">
    <button class="btn primary" id="respawn">RESPAWN</button>
    <button class="btn quit" id="quit">QUIT</button>
  </div>
      <div class="version-stamp">DEV BUILD v0.18.2</div>
    </div><!-- /.stage -->
  </div><!-- /.fit-viewport -->

<script>
    // Uniformly scale the 2560×1440 stage to fit any viewport.
    (function fitStage(){
      const stage = document.getElementById('stage');
      function fit(){
        const s = Math.min(window.innerWidth / 2560, window.innerHeight / 1440);
        stage.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit, { passive:true });
      fit();
    })();

// ---------------------------------------------------------------
// The quip is picked from the cause of death when one is known,
// otherwise from the generic pool. Set CAUSE to any key below.
// ---------------------------------------------------------------
const CAUSE = 'goblins';   // bear | wolves | starved | froze | fell | drowned | dark | mob | burned | mining | goblins | null

const BY_CAUSE = {
  bear:    ["You tried to outrun a bear. The bear also runs.",
            "The bear was not bluffing.",
            "Bears do not respect your tool tier."],
  wolves:  ["Three wolves. One of you. You did the arithmetic afterwards.",
            "The pack tested your camp for two nights. You failed on the third.",
            "You brought a stone axe to a wolf problem."],
  starved: ["Try not to starve next time.",
            "You had eleven logs and no food. Priorities.",
            "The berries were right there. Two hundred paces back."],
  froze:   ["Winter arrived on schedule. Your roof did not.",
            "You froze eight paces from a pile of unlit firewood.",
            "Cold is not a difficulty setting."],
  fell:    ["Gravity remains undefeated.",
            "You mined the block you were standing on. Again.",
            "It was only nineteen blocks. Nineteen is a lot."],
  drowned: ["You could see the surface the whole time.",
            "Swimming with a full pack of ore was ambitious.",
            "The water was deeper than it looked from up there."],
  dark:    ["Something in the dark had been waiting all night. It was patient.",
            "You went in without a torch. It went in without hesitation.",
            "The cave was warm for a reason."],
  mob:     ["It got closer than you thought it could.",
            "You blocked. It did not care.",
            "That was not a wolf."],
  burned:  ["The campfire was inside the shelter. The shelter was made of wood.",
            "You built the roof out of thatch and then made fire underneath it.",
            "Fire spreads. This is documented."],
  mining:  ["You dug straight down. Everyone says not to. You did it anyway.",
            "The ore was directly above the lava. That is where ore lives.",
            "One more block, you said."],
  goblins: ["The goblins looted your home and burned your family.",
            "They took the tools, the grain and the roof. Then the rest.",
            "You were three hundred paces away, carrying firewood."]
};

const GENERIC = [
  "Try not to starve next time.",
  "The world does not keep notes on how hard you tried.",
  "Somewhere out there, your tools are still in a chest.",
  "You lasted longer than most. Not much longer.",
  "Consider a wall. Walls have worked before.",
  "Nothing out here was ever on your side.",
  "Eat something. Sleep somewhere. Build a door.",
  "Your camp is exactly where you left it. So is everything else.",
  "Being brave and being prepared are different projects.",
  "The night was always going to win one of these."
];

const pool = (CAUSE && BY_CAUSE[CAUSE]) || GENERIC;
document.getElementById('quip').textContent = pool[Math.floor(Math.random() * pool.length)];

document.getElementById('respawn').addEventListener('click', () => location.href = 'Voxelmark HUD v2.html');
document.getElementById('quit').addEventListener('click', () => location.href = 'Voxelmark Main Menu.html');
window.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('respawn').click();
  if (e.key === 'Escape') document.getElementById('quit').click();
});
</script>
</body>
</html>
