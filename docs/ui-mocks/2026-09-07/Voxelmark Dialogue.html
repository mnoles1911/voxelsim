<!doctype html>
<!-- @dsCard group="Brand" name="Voxelmark Dialogue" subtitle="Conversation overlay — speaker top-left, replies top-right, skill checks bottom-right" viewport="2560x1440" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Voxelmark — Dialogue</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menus_shared.css" />
<style>
  /* =========================================================
     Tier 2 dialogue (per design/CONVERSATION_SYSTEM.md)
     Background is the live game scene. The dialogue overlay
     dims it, sits the NPC speaker block top-left, Roland's
     response options top-right, and the skill/coin strip
     bottom-right.
     ========================================================= */
  body{ background:#000; image-rendering:auto;
        -webkit-font-smoothing:antialiased; font-smooth:auto; }

  .fit-viewport{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  .stage{
    position:relative;
    width:1920px; height:1080px; zoom:1.33333;
    transform-origin:center center;
    overflow:hidden;
    background:#000;
    flex-shrink:0;
  }
  /* world scene placeholder (frozen, dimmed during dialogue) */
  .scene-bg{ position:absolute; }
  .scene-tint{ position:absolute; }
  .scene-vignette{ position:absolute; }
  .bg-grain{ position:absolute; }

  /* compass + interaction prompt remain on the HUD during Tier 2
     dialogue per design/HUD_AND_UI.md — the HUD is hidden during
     dialogue but the world stays visible, so the only thing we
     render on top is the .dlg-stage overlay. */

  /* prevent the .menu-shell skill icons from leaking through */
  .dlg-stage .ico{ width:100%; height:100%; }
</style>
</head>
<body>
  <div class="fit-viewport">
    <div class="stage" id="stage">

      <!-- frozen world backdrop -->
      <div class="scene-bg" style="background-image:url('assets/menu_backgrounds/castle_feast_background1.jpg')"></div>
      <div class="scene-vignette"></div>
      <div class="scene-tint" style="background:rgba(0,0,0,0.25)"></div>

      <!-- dialogue overlay -->
      <div class="dlg-stage" id="dlgStage">

        <!-- top-left companion observation (renders only when active) -->
        <div class="dlg-companion" id="dlgCompanion" style="display:none">
          <div class="dlg-companion__portrait">
            <svg viewBox="0 0 48 60" preserveAspectRatio="xMidYMid slice">
              <!-- Orion: hooded silhouette, slate / brigandine palette -->
              <rect x="0" y="0" width="48" height="60" fill="#1a1a20"/>
              <path d="M 8 60 L 8 32 Q 24 14, 40 32 L 40 60 Z" fill="#3a3a48"/>
              <path d="M 14 60 L 14 38 Q 24 28, 34 38 L 34 60 Z" fill="#2a2a35"/>
              <ellipse cx="24" cy="36" rx="9" ry="11" fill="#a08570"/>
              <path d="M 13 32 Q 24 18, 35 32 L 33 38 Q 24 26, 15 38 Z" fill="#1a1a20"/>
              <circle cx="20" cy="38" r="1.2" fill="#0a0a10"/>
              <circle cx="28" cy="38" r="1.2" fill="#0a0a10"/>
              <path d="M 21 42 Q 24 43, 27 42" stroke="#0a0a10" stroke-width="0.6" fill="none"/>
            </svg>
          </div>
          <div>
            <div class="dlg-companion__name" id="compName">ORION</div>
            <div class="dlg-companion__line" id="compLine">There's a side door behind the tapestry — you saw it on the way in.</div>
          </div>
        </div>

        <!-- top-right timer (renders only when active) -->
        <div class="dlg-timer" id="dlgTimer" style="display:none">
          <div class="dlg-timer__ring" id="dlgRing" style="--p:300deg"></div>
          <div class="dlg-timer__glass"></div>
        </div>

        <!-- top skills strip (renders only when ≥1 skill check) -->
        <div class="dlg-skills" id="dlgSkills"></div>

        <!-- NPC speaker block bottom-left -->
        <div class="dlg-speaker">
          <div class="dlg-portrait" id="dlgPortrait">
            <svg viewBox="0 0 160 200" preserveAspectRatio="xMidYMid slice">
              <!-- Captain Vossant: stern, scarred, gold-trim cuirass -->
              <defs>
                <linearGradient id="armor" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%"  stop-color="#5a4a3a"/>
                  <stop offset="50%" stop-color="#3a2a1a"/>
                  <stop offset="100%" stop-color="#1a0e08"/>
                </linearGradient>
              </defs>
              <rect x="0" y="0" width="160" height="200" fill="#14100a"/>
              <!-- shoulders / cuirass -->
              <path d="M 0 200 L 0 140 Q 20 110, 50 100 L 110 100 Q 140 110, 160 140 L 160 200 Z" fill="url(#armor)"/>
              <!-- gold trim -->
              <path d="M 0 140 Q 20 110, 50 100 L 110 100 Q 140 110, 160 140"
                    stroke="#a87320" stroke-width="2.5" fill="none"/>
              <path d="M 0 152 Q 30 130, 80 124 Q 130 130, 160 152"
                    stroke="#f0c14b" stroke-width="1" fill="none" opacity="0.7"/>
              <!-- shoulder studs -->
              <circle cx="20" cy="138" r="3" fill="#f0c14b" stroke="#3a2a14"/>
              <circle cx="140" cy="138" r="3" fill="#f0c14b" stroke="#3a2a14"/>
              <circle cx="34" cy="124" r="3" fill="#f0c14b" stroke="#3a2a14"/>
              <circle cx="126" cy="124" r="3" fill="#f0c14b" stroke="#3a2a14"/>
              <!-- neck -->
              <rect x="68" y="85" width="24" height="22" fill="#a08570"/>
              <!-- collar shadow -->
              <path d="M 60 100 L 100 100 L 95 110 L 65 110 Z" fill="#1a0e08" opacity="0.7"/>
              <!-- head -->
              <ellipse cx="80" cy="60" rx="32" ry="38" fill="#a89070"/>
              <!-- shadow on face right side -->
              <path d="M 80 22 Q 112 30, 112 60 Q 112 90, 80 98 Z" fill="#1a0e08" opacity="0.18"/>
              <!-- hair -->
              <path d="M 50 35 Q 80 18, 110 35 Q 116 50, 110 60 L 108 42 Q 80 32, 52 42 L 50 60 Q 44 50, 50 35 Z" fill="#3a2a1a"/>
              <!-- temple grey streak -->
              <path d="M 52 44 Q 56 50, 54 60 L 50 60 Q 46 52, 52 44 Z" fill="#8a7a64"/>
              <!-- brow line -->
              <path d="M 60 56 L 70 55 M 90 55 L 100 56" stroke="#1a0e08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <!-- scar across right eye -->
              <path d="M 96 50 L 104 70" stroke="#5a3a2a" stroke-width="1.5"/>
              <!-- eyes -->
              <ellipse cx="65"  cy="62" rx="2.5" ry="2" fill="#1a0e08"/>
              <ellipse cx="95"  cy="62" rx="2.5" ry="2" fill="#1a0e08"/>
              <!-- nose -->
              <path d="M 80 62 L 78 78 L 82 80" stroke="#5a3a2a" stroke-width="1.2" fill="none"/>
              <!-- mouth — flat, serious -->
              <path d="M 70 84 Q 80 87, 90 84" stroke="#3a1a14" stroke-width="2" fill="none" stroke-linecap="round"/>
              <!-- stubble -->
              <ellipse cx="80" cy="92" rx="22" ry="3" fill="#3a2a1a" opacity="0.4"/>
            </svg>
          </div>
          <div class="dlg-speaker__body">
            <div class="dlg-speaker__name">
              <span id="npcName">CAPTAIN VOSSANT</span>
              <span class="role" id="npcRole">— Golden Lance, Solgrade</span>
            </div>
            <div class="dlg-speaker__line" id="npcLine">
              "The fine is a hundred and twenty crowns. The cell is for ten days.
              Either way you'll leave this hall a smaller man than you came in.
              Choose."
            </div>
          </div>
        </div>

        <!-- Roland's options stack bottom-right -->
        <div class="dlg-options" id="dlgOptions"></div>

      </div>

    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script>
    // ===========================================================
    // Sample dialogue node — Captain Vossant fine-or-cell scene.
    // Roland is unvoiced per CONVERSATION_SYSTEM.md "Roland Voicing
    // Policy" — text only on his side.
    // ===========================================================
    const PLAYER_SKILLS = {
      speech:    32,   // Speech (12 skills, 1-100, per SKILLS_AND_PROGRESSION.md)
      charisma:  17,   // attribute (UI-only, derived for skill-check rolls)
      strength:  19,
      coin:     142,   // player currency for "I'll pay the fine" options
      reputation: 8,   // Golden Lance disposition (-100..+100)
    };

    // Each option is one Roland response. Some are normal, some are
    // skill checks (visible-but-greyed pattern per SpeechCheckBroker).
    // KCD2 difficulty bands: EASY / MEDIUM / HARD with a check value.
    const OPTIONS = [
      { id:'pay',     text: "I'll pay the fine. (120)",  cost:120, key:'1',
        skicon:'sk-coin', needs:'coin', threshold:120 },
      { id:'accept',  text: "I accept my punishment.",                key:'2' },
      { id:'speech-easy', text: "We can come to an agreement…",      key:'3',
        skicon:'sk-speech', skillCheck:{ skill:'speech', difficulty:'EASY',   threshold:18 } },
      { id:'cha-easy',    text: "Do you know who I am?",             key:'4',
        skicon:'sk-charisma', skillCheck:{ skill:'charisma', difficulty:'EASY',   threshold:14 } },
      { id:'str-medium',  text: "Let me go, or else!",               key:'5',
        skicon:'sk-strength', skillCheck:{ skill:'strength', difficulty:'MEDIUM', threshold:22 } },
      { id:'rep-medium',  text: "The law is on my side.",            key:'6',
        skicon:'sk-rep', skillCheck:{ skill:'reputation', difficulty:'MEDIUM', threshold:25 } },
      { id:'sp-medium',   text: "I just had a bit to drink…",        key:'7',
        skicon:'sk-speech', skillCheck:{ skill:'speech', difficulty:'MEDIUM', threshold:45 } },
    ];

    // ===========================================================
    // State
    // ===========================================================
    let selected = 0;
    let timerRemaining = 12;   // seconds
    let timerHandle = null;
    let timerEnabled = false;
    let showSkillsStrip = true;
    let showCompanion = false;
    let showTimer = false;

    // ===========================================================
    // Render
    // ===========================================================
    function renderSkillsStrip() {
      const el = document.getElementById('dlgSkills');
      if (!showSkillsStrip) { el.style.display = 'none'; return; }
      el.style.display = 'flex';
      const fields = [
        { name:'SPEECH',    val: PLAYER_SKILLS.speech,     ico:'sk-speech' },
        { name:'CHARISMA',  val: PLAYER_SKILLS.charisma,   ico:'sk-charisma' },
        { name:'STRENGTH',  val: PLAYER_SKILLS.strength,   ico:'sk-strength' },
        { name:'REPUTATION',val: PLAYER_SKILLS.reputation, ico:'sk-rep' },
        { name:'COIN',      val: PLAYER_SKILLS.coin,       ico:'sk-coin' },
      ];
      el.innerHTML = fields.map(f => `
        <div class="dlg-skill">
          <div class="dlg-skill__ico ${f.ico}"></div>
          <div class="dlg-skill__val">${f.val}</div>
          <div class="dlg-skill__name">${f.name}</div>
        </div>
      `).join('');
    }

    function isAvailable(opt) {
      // visible-but-greyed: speech checks always visible, but the
      // SpeechCheckBroker won't let Roland succeed below threshold.
      // For UI: gold if pass, dim if fail. Cost options dim if can't afford.
      if (opt.needs === 'coin') return PLAYER_SKILLS.coin >= opt.threshold;
      if (opt.skillCheck) {
        return PLAYER_SKILLS[opt.skillCheck.skill] >= opt.skillCheck.threshold;
      }
      return true;
    }

    function renderOptions() {
      const el = document.getElementById('dlgOptions');
      el.innerHTML = OPTIONS.map((opt, i) => {
        const cls = ['dlg-option'];
        if (i === selected) cls.push('selected');
        const ok = isAvailable(opt);
        if (!ok) cls.push('disabled');

        const skicon = opt.skicon
          ? `<div class="dlg-option__skicon ${opt.skicon}"></div>` : '';
        const badge  = opt.skillCheck
          ? `<span class="dlg-option__badge ${opt.skillCheck.difficulty.toLowerCase()}">${opt.skillCheck.difficulty}</span>`
          : '';
        return `
          <button class="${cls.join(' ')}" data-idx="${i}" ${ok?'':'disabled'}>
            ${skicon}${badge}
            <span class="dlg-option__key">${opt.key}</span>
            <span class="dlg-option__text">${opt.text}</span>
            <span class="dlg-option__diamond"></span>
          </button>
        `;
      }).join('');
      el.querySelectorAll('.dlg-option').forEach(btn => {
        btn.addEventListener('mouseenter', () => {
          if (btn.disabled) return;
          selected = parseInt(btn.dataset.idx, 10);
          renderOptions();
        });
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          commit(parseInt(btn.dataset.idx, 10));
        });
      });
    }

    function commit(idx) {
      const opt = OPTIONS[idx];
      // For the design demo: just flash the speaker line so designer
      // can see selection feedback. Real version hands off to Dialogic.
      const line = document.getElementById('npcLine');
      const prev = line.textContent;
      if (opt.skillCheck) {
        const ok = isAvailable(opt);
        line.textContent = ok
          ? `[ ${opt.skillCheck.skill.toUpperCase()} ${opt.skillCheck.difficulty} ✓ ] ` + opt.text
          : `[ ${opt.skillCheck.skill.toUpperCase()} ${opt.skillCheck.difficulty} ✗ ] ` + opt.text;
      } else {
        line.textContent = '› ' + opt.text;
      }
      setTimeout(() => { line.textContent = prev; }, 1800);
    }

    // ===========================================================
    // Keyboard: number keys 1..9 commit; arrows move selection
    // ===========================================================
    document.addEventListener('keydown', (e) => {
      if (/^[1-9]$/.test(e.key)) {
        const idx = OPTIONS.findIndex(o => o.key === e.key);
        if (idx >= 0) { selected = idx; renderOptions(); commit(idx); }
        return;
      }
      if (e.key === 'ArrowUp')   { selected = (selected - 1 + OPTIONS.length) % OPTIONS.length; renderOptions(); }
      if (e.key === 'ArrowDown') { selected = (selected + 1) % OPTIONS.length; renderOptions(); }
      if (e.key === 'Enter')     { commit(selected); }
    });

    // ===========================================================
    // Timer (hourglass) — counts down then auto-commits to slot 0
    // ===========================================================
    function startTimer(seconds) {
      timerRemaining = seconds;
      const totalDeg = 360;
      function tick() {
        const ring = document.getElementById('dlgRing');
        const pct = timerRemaining / seconds;
        ring.style.setProperty('--p', (pct * totalDeg) + 'deg');
        if (timerRemaining <= 0) {
          clearInterval(timerHandle); timerHandle = null;
          commit(0);
          return;
        }
        timerRemaining -= 0.1;
      }
      tick();
      timerHandle = setInterval(tick, 100);
    }
    function stopTimer() {
      if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    }

    function applyTimerVisibility() {
      const el = document.getElementById('dlgTimer');
      if (showTimer) {
        el.style.display = 'grid';
        stopTimer();
        startTimer(12);
      } else {
        el.style.display = 'none';
        stopTimer();
      }
    }

    function applyCompanionVisibility() {
      document.getElementById('dlgCompanion').style.display =
        showCompanion ? 'flex' : 'none';
    }

    // ===========================================================
    // Stage scaler (same as main menu / HUD)
    // ===========================================================
    (function fitStage(){
      const stage = document.getElementById('stage');
      function fit(){
        const sx = window.innerWidth  / 2560;
        const sy = window.innerHeight / 1440;
        const s  = Math.min(sx, sy);
        stage.style.transform = `scale(${s})`;
      }
      window.addEventListener('resize', fit, { passive:true });
      fit();
    })();

    // initial render
    renderSkillsStrip();
    renderOptions();
    applyTimerVisibility();
    applyCompanionVisibility();
  </script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "showSkillsStrip": true,
      "showTimer": false,
      "showCompanion": false,
      "speechLevel": 32,
      "charismaLevel": 17,
      "strengthLevel": 19,
      "reputationLevel": 8,
      "coin": 142
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      React.useEffect(() => {
        // live-update player skills + re-render dependents
        PLAYER_SKILLS.speech     = t.speechLevel;
        PLAYER_SKILLS.charisma   = t.charismaLevel;
        PLAYER_SKILLS.strength   = t.strengthLevel;
        PLAYER_SKILLS.reputation = t.reputationLevel;
        PLAYER_SKILLS.coin       = t.coin;

        showSkillsStrip = t.showSkillsStrip;
        showTimer       = t.showTimer;
        showCompanion   = t.showCompanion;

        renderSkillsStrip();
        renderOptions();
        applyTimerVisibility();
        applyCompanionVisibility();
      }, [t]);

      return (
        <TweaksPanel title="Dialogue Tweaks">
          <TweakSection label="States" />
          <TweakToggle label="Skill stats strip"        value={t.showSkillsStrip} onChange={(v) => setTweak('showSkillsStrip', v)} />
          <TweakToggle label="Timer (12s, auto-commit)" value={t.showTimer}       onChange={(v) => setTweak('showTimer', v)} />
          <TweakToggle label="Companion observation"    value={t.showCompanion}   onChange={(v) => setTweak('showCompanion', v)} />
          <TweakSection label="Player skill scores (drives EASY/MEDIUM gating)" />
          <TweakSlider label="Speech"     value={t.speechLevel}     min={1} max={100} onChange={(v) => setTweak('speechLevel', v)} />
          <TweakSlider label="Charisma"   value={t.charismaLevel}   min={1} max={30}  onChange={(v) => setTweak('charismaLevel', v)} />
          <TweakSlider label="Strength"   value={t.strengthLevel}   min={1} max={30}  onChange={(v) => setTweak('strengthLevel', v)} />
          <TweakSlider label="Reputation" value={t.reputationLevel} min={-100} max={100} onChange={(v) => setTweak('reputationLevel', v)} />
          <TweakSlider label="Coin"       value={t.coin}            min={0} max={500} unit="☉" onChange={(v) => setTweak('coin', v)} />
        </TweaksPanel>
      );
    }

    const root = document.createElement('div');
    document.body.appendChild(root);
    ReactDOM.createRoot(root).render(<App />);
  </script>
</body>
</html>
